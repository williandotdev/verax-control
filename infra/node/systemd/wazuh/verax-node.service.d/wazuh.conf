# Complemento do verax-node.service no perfil standard (o install.sh o põe em /etc/systemd/system/verax-node.service.d/;
# o nó da Verax, lean, não o recebe): `systemctl start` ou `restart verax-node` sobe o verax-wazuh junto, também quando
# ele estava parado ou em `failed` (o Requires do verax-wazuh só propaga o restart enquanto ele está no ar). O
# `After=verax-node.service` dele mantém a ordem, e Wants não propaga a falha: o Wazuh caindo não derruba o nó.
[Unit]
Wants=verax-wazuh.service
