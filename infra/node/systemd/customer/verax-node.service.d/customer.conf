# Complemento do verax-node.service no modo cliente (o install.sh o põe em /etc/systemd/system/verax-node.service.d/; o
# nó da Verax não o recebe): `systemctl start` ou `restart verax-node` sobe o verax-customer-bootstrap junto, também
# quando ele estava em `failed` (o Requires dele só propaga o restart enquanto ele está no ar). O `After=` dele mantém a
# ordem, e Wants não propaga a falha: o primeiro acesso falhando não derruba o nó.
[Unit]
Wants=verax-customer-bootstrap.service
