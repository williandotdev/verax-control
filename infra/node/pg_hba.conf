# Acesso ao PostgreSQL do nó. Pela rede (API, worker, migrations), só com TLS e senha (SCRAM); o socket local só existe
# dentro do contêiner do banco, usado pela inicialização e pelo backup (docker exec, só root na VM).
local   all  all                trust
hostssl all  all  0.0.0.0/0     scram-sha-256
hostssl all  all  ::/0          scram-sha-256
