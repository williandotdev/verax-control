<!--
  Configuração central dos agentes do nó (grupo `default`, o de todo agente registrado; WAZUH_AGENTS=true no
  node.conf). O gerador (scripts/render-manager-config.py) a põe em etc/shared/default/agent.conf; o manager a manda a
  cada agente, que a junta ao ossec.conf local dele e reinicia sozinho quando ela muda. Seções aceitas no agent.conf
  pela referência do Wazuh 4.14 (reference/centralized-configuration.html).

  Uma linha de base, igual em todo agente, sem nada que execute comando na instância:
  - nenhuma coleta de log por comando (as opções command e full_command do localfile) e nenhum módulo de comando: o
    agente só os aceitaria com os remote_commands ligados no local_internal_options.conf dele (padrão 0), e o nó nunca
    os pede. O CI confere que nem a etiqueta deles aparece neste arquivo;
  - monitoramento de integridade (FIM) nos diretórios padrão do pacote do agente (no Linux, /etc, /usr/bin, /usr/sbin,
    /bin, /sbin e /boot; no Windows, os do pacote), a cada 12 h, sem tempo real;
  - inventário (syscollector) a cada hora: é dele que o manager tira a detecção de vulnerabilidades;
  - avaliação de configuração (SCA) com as políticas que vêm no pacote, a cada 12 h;
  - limite de eventos por agente (client_buffer): uma instância barulhenta não afoga o manager do nó, que tem 1,5 GiB.
-->
<agent_config>
  <client_buffer>
    <disabled>no</disabled>
    <queue_size>5000</queue_size>
    <events_per_second>200</events_per_second>
  </client_buffer>

  <syscheck>
    <disabled>no</disabled>
    <frequency>43200</frequency>
    <scan_on_start>yes</scan_on_start>
    <alert_new_files>yes</alert_new_files>
  </syscheck>

  <rootcheck>
    <disabled>no</disabled>
    <frequency>43200</frequency>
  </rootcheck>

  <wodle name="syscollector">
    <disabled>no</disabled>
    <interval>1h</interval>
    <scan_on_start>yes</scan_on_start>
    <hardware>yes</hardware>
    <os>yes</os>
    <network>yes</network>
    <packages>yes</packages>
    <ports all="no">yes</ports>
    <processes>no</processes>
  </wodle>

  <sca>
    <enabled>yes</enabled>
    <scan_on_start>yes</scan_on_start>
    <interval>12h</interval>
    <skip_nfs>yes</skip_nfs>
  </sca>
</agent_config>
