<!--
  Agentes do Wazuh nas instâncias do cliente (WAZUH_AGENTS=true no node.conf; desligado por padrão). Com o interruptor,
  o scripts/render-manager-config.py troca pelos blocos daqui os de mesmo nome do ossec.conf do nó (o <remote> só no
  loopback, o <auth> desligado e a detecção de vulnerabilidades desligada) e acrescenta os que ele não tem. Sem o
  interruptor, nada daqui é lido e o ossec.conf sai como sempre.

  Opções conferidas na referência do Wazuh 4.14 (documentation.wazuh.com/4.14/user-manual/reference/ossec-conf/):
  - <remote> (remote.html): conexão segura (chave por agente) em TCP 1514, em todas as interfaces do contêiner (o Docker
    publica a porta no host; quem chega até ela é decidido pelo firewall da GCP, só com as faixas do cliente). Agente
    mais novo que o manager é recusado (`allow_higher_versions`, o padrão, explícito).
  - <auth> (auth.html): registro em TCP 1515 só com a senha do nó (`use_password`; o authd lê etc/authd.pass, que o
    gerador escreve a partir de /var/lib/verax/secrets/wazuh-agents-enrollment. Sem o arquivo, o authd geraria uma
    senha aleatória). O certificado do registro é o do nó (CN e SAN com o IP fixo dos agentes), emitido pelo install.sh
    com uma CA só dos agentes: o agente instalado com WAZUH_REGISTRATION_CA confere o manager antes de mandar a senha
    (manager-identity-verification.html). Sem `use_source_ip`: o agente chega pelo NAT do cliente e fica com IP `any`.
    `force` e `purge` com os valores padrão, explícitos.
  - <active-response> (active-response.html): `disabled` no ossec.conf do manager desliga a resposta ativa no manager
    e em todos os agentes. Nenhum comando de resposta é definido: o manager não manda executar nada nas instâncias.
  - <vulnerability-detection> (vuln-detector.html): ligada, a partir do inventário (syscollector) que os agentes
    mandam e do feed da CTI do Wazuh (saída pela rede `wazuh-egress`). Sem `index-status`: o estado das
    vulnerabilidades não vai para o indexer (o usuário do filebeat só grava alertas); as detecções viram alertas, como
    qualquer outra regra.
  O comando remoto nos agentes (logcollector.remote_commands, wazuh_command.remote_commands e sca.remote_commands, em
  internal-options.html) fica no padrão do agente, 0, e o agent.conf do grupo não define comando nenhum: o CI confere.
-->
<ossec_config>
  <remote>
    <connection>secure</connection>
    <port>1514</port>
    <protocol>tcp</protocol>
    <queue_size>131072</queue_size>
    <agents>
      <allow_higher_versions>no</allow_higher_versions>
    </agents>
  </remote>

  <auth>
    <disabled>no</disabled>
    <remote_enrollment>yes</remote_enrollment>
    <port>1515</port>
    <use_source_ip>no</use_source_ip>
    <purge>yes</purge>
    <use_password>yes</use_password>
    <ciphers>HIGH:!ADH:!EXP:!MD5:!RC4:!3DES:!CAMELLIA:@STRENGTH</ciphers>
    <ssl_verify_host>no</ssl_verify_host>
    <ssl_manager_cert>/etc/ssl/verax-agents/manager.crt</ssl_manager_cert>
    <ssl_manager_key>/etc/ssl/verax-agents/manager.key</ssl_manager_key>
    <ssl_auto_negotiate>no</ssl_auto_negotiate>
    <force>
      <enabled>yes</enabled>
      <key_mismatch>yes</key_mismatch>
      <disconnected_time enabled="yes">1h</disconnected_time>
      <after_registration_time>1h</after_registration_time>
    </force>
  </auth>

  <active-response>
    <disabled>yes</disabled>
  </active-response>

  <vulnerability-detection>
    <enabled>yes</enabled>
    <index-status>no</index-status>
    <feed-update-interval>60m</feed-update-interval>
  </vulnerability-detection>
</ossec_config>
