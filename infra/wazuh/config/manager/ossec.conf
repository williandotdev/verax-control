<!--
  Manager do Wazuh (T4.2 e fase 2, PR-W1). Baseado no wazuh_manager.conf do single-node oficial (v4.14.9). Mudanças:
  - sem agentes: o registro de agentes (authd) fica desligado e o remoted escuta só em 127.0.0.1 (nenhum outro
    contêiner alcança a porta 1514). O bloco <remote> não pode sair: sem ele, o remoted recusa a configuração e o
    wazuh-control não sobe nenhum daemon (conferido na 4.14.9);
  - sem monitoramento de arquivos, rootkit, SCA, inventário (syscollector) e detecção de vulnerabilidades do próprio
    contêiner: só gerariam ruído, baixariam o feed da CTI e criariam índices de estado. Também deixam o medidor de uso
    (bytes recebidos pelo analysisd) só com os logs dos clientes;
  - só alertas de nível 5 para cima vão para o indexer (o mesmo corte da sincronização dos achados). O analysisd
    continua vendo todos os eventos, e as correlações seguem valendo; o índice guarda 30 dias, com 1 shard por dia
    (scripts/configure-indexer.sh);
  - sem o alerts.log em texto: o filebeat lê só o alerts.json, e os arquivos diários compactados com mais de 7 dias são
    apagados no nó pelo verax-wazuh-alerts.timer;
  - sem o bloco de cluster, que trazia uma chave fixa (o single-node não usa cluster);
  - certificados do indexer no volume próprio do manager (/etc/ssl/verax).
  As fontes da AWS (módulo aws-s3) são acrescentadas pelo scripts/render-manager-config.py.
-->
<ossec_config>
  <global>
    <jsonout_output>yes</jsonout_output>
    <alerts_log>no</alerts_log>
    <logall>no</logall>
    <logall_json>no</logall_json>
    <email_notification>no</email_notification>
    <agents_disconnection_time>10m</agents_disconnection_time>
    <agents_disconnection_alert_time>0</agents_disconnection_alert_time>
  </global>

  <alerts>
    <log_alert_level>5</log_alert_level>
  </alerts>

  <logging>
    <log_format>plain</log_format>
  </logging>

  <remote>
    <connection>secure</connection>
    <port>1514</port>
    <protocol>tcp</protocol>
    <local_ip>127.0.0.1</local_ip>
    <queue_size>131072</queue_size>
  </remote>

  <rootcheck>
    <disabled>yes</disabled>
  </rootcheck>

  <syscheck>
    <disabled>yes</disabled>
  </syscheck>

  <sca>
    <enabled>no</enabled>
  </sca>

  <wodle name="syscollector">
    <disabled>yes</disabled>
    <interval>1h</interval>
    <scan_on_start>yes</scan_on_start>
    <hardware>yes</hardware>
    <os>yes</os>
    <network>yes</network>
    <packages>yes</packages>
    <ports all="no">yes</ports>
    <processes>no</processes>
    <synchronization>
      <max_eps>10</max_eps>
    </synchronization>
  </wodle>

  <vulnerability-detection>
    <enabled>no</enabled>
    <index-status>yes</index-status>
    <feed-update-interval>60m</feed-update-interval>
  </vulnerability-detection>

  <indexer>
    <enabled>yes</enabled>
    <hosts>
      <host>https://wazuh.indexer:9200</host>
    </hosts>
    <ssl>
      <certificate_authorities>
        <ca>/etc/ssl/verax/root-ca.pem</ca>
      </certificate_authorities>
      <certificate>/etc/ssl/verax/wazuh.manager.pem</certificate>
      <key>/etc/ssl/verax/wazuh.manager-key.pem</key>
    </ssl>
  </indexer>

  <ruleset>
    <decoder_dir>ruleset/decoders</decoder_dir>
    <rule_dir>ruleset/rules</rule_dir>
    <rule_exclude>0215-policy_rules.xml</rule_exclude>
    <list>etc/lists/audit-keys</list>
    <list>etc/lists/amazon/aws-eventnames</list>
    <list>etc/lists/security-eventchannel</list>
    <list>etc/lists/malicious-ioc/malicious-ip</list>
    <list>etc/lists/malicious-ioc/malicious-domains</list>
    <list>etc/lists/malicious-ioc/malware-hashes</list>
    <decoder_dir>etc/decoders</decoder_dir>
    <rule_dir>etc/rules</rule_dir>
  </ruleset>

  <rule_test>
    <enabled>yes</enabled>
    <threads>1</threads>
    <max_sessions>64</max_sessions>
    <session_timeout>15m</session_timeout>
  </rule_test>

  <auth>
    <disabled>yes</disabled>
  </auth>
</ossec_config>
