---
# Mapeamento de papéis do indexer (T4.8), aplicado inteiro a cada deploy. Só o que o Wazuh e a Verax usam: os
# mapeamentos de demonstração da imagem ficam de fora, inclusive o `own_index` para todos os usuários, que daria a
# qualquer usuário (até o de leitura) escrita num índice com o nome dele. Sem dashboard (fase 2, PR-W1), saem também
# os do usuário de serviço dele (kibana_server e manage_wazuh_index).
_meta:
  type: 'rolesmapping'
  config_version: 2

all_access:
  reserved: true
  backend_roles:
    - 'admin'
  description: 'Administração (usuário admin)'

verax_api_read:
  reserved: true
  users:
    - 'verax_api_read'
  description: 'API do Verax Control: só leitura dos alertas'

wazuh_filebeat:
  reserved: true
  users:
    - 'wazuh_filebeat'
  description: 'Filebeat do manager do Wazuh: só escrita dos alertas'
