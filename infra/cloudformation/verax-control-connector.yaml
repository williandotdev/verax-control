# Obsoleto desde a revisão de 04/11/2026 (fase 2, D-17): as contas novas usam o usuário de leitura
# (verax-control-reader.yaml). Guardado para um futuro modo Enterprise, com papel e ExternalId.
AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Verax Control - conector da conta monitorada. Cria só o papel somente leitura VeraxControlReadOnly, que só o nó do
  Verax Control pode assumir (com ExternalId). Não cria nem altera trilhas, destinos de log, buckets, assinaturas ou
  políticas existentes, e nega explicitamente as ações que poderiam apagar ou alterar logs.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: { default: Quem acessa (o nó do Verax Control) }
        Parameters: [NodeAccountId, NodeRoleName, ExternalId]
      - Label: { default: Logs que o Verax Control pode ler (já existentes nesta conta) }
        Parameters: [LogGroupArns, LogBucketArns, LogKmsKeyArns]
    ParameterLabels:
      NodeAccountId: { default: Conta AWS onde roda o nó }
      NodeRoleName: { default: Nome do papel do nó }
      ExternalId: { default: ExternalId informado pela Verax }
      LogGroupArns: { default: Grupos do CloudWatch Logs }
      LogBucketArns: { default: Buckets S3 de log }
      LogKmsKeyArns: { default: Chaves KMS dos buckets de log }

Parameters:
  NodeAccountId:
    Type: String
    Description: >-
      Conta AWS onde roda o nó do Verax Control (12 dígitos): esta mesma conta, se o nó roda aqui, ou a conta da
      Verax. Nos dois casos o nó só chega aos dados por este papel.
    AllowedPattern: '^[0-9]{12}$'
    ConstraintDescription: 12 dígitos.
  NodeRoleName:
    Type: String
    Description: Papel da instância do nó, criado pela pilha do nó. Só ele pode assumir o papel de leitura.
    Default: verax-control-node
    AllowedPattern: '^verax-control-node[A-Za-z0-9+=,.@_-]{0,46}$'
    ConstraintDescription: começa com verax-control-node e tem até 64 caracteres.
  ExternalId:
    Type: String
    Description: Segredo compartilhado gerado pelo painel da Verax para esta conta. Não é exibido depois.
    NoEcho: true
    MinLength: 32
    MaxLength: 128
    AllowedPattern: '^[A-Za-z0-9+=,.@:/_-]+$'
  LogGroupArns:
    Type: CommaDelimitedList
    Description: >-
      ARNs dos grupos de log que o Verax Control pode ler, separados por vírgula, no formato do campo "logGroupArn" do
      describe-log-groups (sem :* no fim). Por exemplo, os grupos do CloudTrail, do WAF e dos VPC Flow Logs. Vazio
      não libera nenhum.
    Default: ''
    AllowedPattern: '^$|^arn:aws[a-z-]*:logs:[a-z0-9-]+:[0-9]{12}:log-group:[A-Za-z0-9_./#-]{1,512}$'
    ConstraintDescription: 'arn:aws:logs:<região>:<conta>:log-group:<nome>'
  LogBucketArns:
    Type: CommaDelimitedList
    Description: >-
      ARNs dos buckets S3 de log que o Verax Control pode ler (CloudTrail, findings exportados do GuardDuty ou do
      Security Hub), separados por vírgula. Vazio não libera nenhum.
    Default: ''
    AllowedPattern: '^$|^arn:aws[a-z-]*:s3:::[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$'
    ConstraintDescription: 'arn:aws:s3:::<bucket>'
  LogKmsKeyArns:
    Type: CommaDelimitedList
    Description: >-
      ARNs das chaves KMS que cifram os buckets acima (SSE-KMS), separados por vírgula. O papel só decifra pelo S3.
      Vazio se os buckets usam a cifragem padrão do S3.
    Default: ''
    AllowedPattern: '^$|^arn:aws[a-z-]*:kms:[a-z0-9-]+:[0-9]{12}:key/[a-f0-9-]{36}$'
    ConstraintDescription: 'arn:aws:kms:<região>:<conta>:key/<id>'

Conditions:
  ReadLogGroups: !Not [!Equals [!Join ['', !Ref LogGroupArns], '']]
  ReadLogBuckets: !Not [!Equals [!Join ['', !Ref LogBucketArns], '']]
  DecryptLogBuckets: !And
    - !Condition ReadLogBuckets
    - !Not [!Equals [!Join ['', !Ref LogKmsKeyArns], '']]

Resources:
  VeraxReadOnlyRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: VeraxControlReadOnly
      Description: Leitura de configuração e de logs de segurança pelo Verax Control.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          # Principal pela conta (e não pelo ARN do papel) para o conector poder ser criado antes do nó; a condição
          # restringe ao papel exato do nó.
          - Sid: SoONoComExternalId
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:${AWS::Partition}:iam::${NodeAccountId}:root'
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                sts:ExternalId: !Ref ExternalId
              ArnEquals:
                aws:PrincipalArn: !Sub 'arn:${AWS::Partition}:iam::${NodeAccountId}:role/${NodeRoleName}'
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/SecurityAudit'
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/job-function/ViewOnlyAccess'
      Policies:
        # Complemento de leitura do Prowler 5.47.0 (permissions/prowler-additions-policy.json), sem as ações que vão
        # além de ler configuração: securityhub:BatchImportFindings (escrita), ecr:BatchGetImage e
        # ecr:GetDownloadUrlForLayer (baixam imagens) e logs:FilterLogEvents (lê o conteúdo dos logs de aplicação).
        - PolicyName: ProwlerLeituraComplementar
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: LeituraComplementar
                Effect: Allow
                Resource: '*'
                Action:
                  - account:Get*
                  - amplify:ListApps
                  - amplify:ListBranches
                  - appstream:Describe*
                  - appstream:List*
                  - backup:Get*
                  - backup:List*
                  - bedrock:Get*
                  - bedrock:List*
                  - cloudtrail:GetInsightSelectors
                  - codeartifact:List*
                  - codebuild:BatchGet*
                  - codebuild:ListReportGroups
                  - cognito-idp:GetUserPoolMfaConfig
                  - datapipeline:DescribePipelines
                  - datapipeline:GetPipelineDefinition
                  - datapipeline:ListPipelines
                  - dlm:Get*
                  - drs:Describe*
                  - ds:Describe*
                  - ds:Get*
                  - ds:List*
                  - dynamodb:GetResourcePolicy
                  - ec2:GetEbsEncryptionByDefault
                  - ec2:GetInstanceMetadataDefaults
                  - ec2:GetSnapshotBlockPublicAccessState
                  - ecr:Describe*
                  - ecr:GetRegistryScanningConfiguration
                  - elasticfilesystem:DescribeBackupPolicy
                  - glue:GetConnections
                  - glue:GetMLTransforms
                  - glue:GetSecurityConfiguration*
                  - glue:SearchTables
                  - inspector2:BatchGetFindingDetails
                  - lambda:GetFunction*
                  - lambda:GetLayerVersion
                  - lightsail:GetRelationalDatabases
                  - macie2:GetAutomatedDiscoveryConfiguration
                  - macie2:GetMacieSession
                  - rolesanywhere:ListProfiles
                  - rolesanywhere:ListTagsForResource
                  - rolesanywhere:ListTrustAnchors
                  - s3:GetAccountPublicAccessBlock
                  - s3:GetObjectAcl
                  - s3:ListBucket
                  - securityhub:GetFindings
                  - servicecatalog:Describe*
                  - servicecatalog:List*
                  - shield:DescribeProtection
                  - shield:GetSubscriptionState
                  - ssm-incidents:List*
                  - ssm:GetDocument
                  - states:ListTagsForResource
                  - support:Describe*
                  - tag:GetTagKeys
                  - wellarchitected:List*
              - Sid: LeituraApiGateway
                Effect: Allow
                Action: apigateway:GET
                Resource:
                  - !Sub 'arn:${AWS::Partition}:apigateway:*::/restapis/*'
                  - !Sub 'arn:${AWS::Partition}:apigateway:*::/apis/*'
                  - !Sub 'arn:${AWS::Partition}:apigateway:*::/domainnames'
                  - !Sub 'arn:${AWS::Partition}:apigateway:*::/domainnames/*'
        # Fontes que o Wazuh do nó coleta: findings pela API (Inspector) e os logs que o cliente escolheu nos
        # parâmetros, já existentes. Nada é criado nem redirecionado: o Verax Control lê de onde o log já está.
        - PolicyName: LerLogsEscolhidos
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: LerFindings
                Effect: Allow
                Resource: '*'
                Action:
                  - access-analyzer:GetFinding
                  - access-analyzer:ListAnalyzers
                  - access-analyzer:ListFindings
                  - guardduty:GetFindings
                  - guardduty:ListDetectors
                  - guardduty:ListFindings
                  - inspector2:ListFindings
                  - securityhub:GetFindings
              # DescribeLogStreams autoriza no ARN do grupo; GetLogEvents, nos streams dele (<arn>:*).
              - !If
                - ReadLogGroups
                - Sid: ListarStreamsDosGruposDeLog
                  Effect: Allow
                  Action: logs:DescribeLogStreams
                  Resource: !Ref LogGroupArns
                - !Ref AWS::NoValue
              - !If
                - ReadLogGroups
                - Sid: LerGruposDeLog
                  Effect: Allow
                  Action: logs:GetLogEvents
                  Resource: !Split [',', !Join ['', [!Join [':*,', !Ref LogGroupArns], ':*']]]
                - !Ref AWS::NoValue
              - !If
                - ReadLogBuckets
                - Sid: ListarBucketsDeLog
                  Effect: Allow
                  Action: [s3:ListBucket, s3:GetBucketLocation]
                  Resource: !Ref LogBucketArns
                - !Ref AWS::NoValue
              - !If
                - ReadLogBuckets
                # Os objetos de cada bucket: <arn>/* para cada ARN da lista.
                - Sid: LerObjetosDeLog
                  Effect: Allow
                  Action: s3:GetObject
                  Resource: !Split [',', !Join ['', [!Join ['/*,', !Ref LogBucketArns], '/*']]]
                - !Ref AWS::NoValue
              - !If
                - DecryptLogBuckets
                - Sid: DecifrarLogsPeloS3
                  Effect: Allow
                  Action: kms:Decrypt
                  Resource: !Ref LogKmsKeyArns
                  Condition:
                    StringLike:
                      kms:ViaService: 's3.*.amazonaws.com'
                - !Ref AWS::NoValue
        # Defesa extra: estas ações continuam negadas mesmo que a AWS amplie as políticas gerenciadas acima. Elas
        # poderiam apagar, desligar ou desviar logs e findings, ou ampliar o acesso do próprio papel.
        - PolicyName: NegarAlteracoes
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: NuncaAlterarLogs
                Effect: Deny
                Resource: '*'
                Action:
                  - access-analyzer:Delete*
                  - access-analyzer:Update*
                  - cloudtrail:Create*
                  - cloudtrail:Delete*
                  - cloudtrail:Put*
                  - cloudtrail:Stop*
                  - cloudtrail:Update*
                  - guardduty:Archive*
                  - guardduty:Create*
                  - guardduty:Delete*
                  - guardduty:Disable*
                  - guardduty:Disassociate*
                  - guardduty:Update*
                  - inspector2:Delete*
                  - inspector2:Disable*
                  - inspector2:Update*
                  - kms:Delete*
                  - kms:Disable*
                  - kms:Put*
                  - kms:ScheduleKeyDeletion
                  - kms:Update*
                  - logs:Associate*
                  - logs:Create*
                  - logs:Delete*
                  - logs:Disassociate*
                  - logs:Put*
                  - logs:Tag*
                  - logs:Unmask
                  - logs:Untag*
                  - logs:Update*
                  - s3:Abort*
                  - s3:Bypass*
                  - s3:Create*
                  - s3:Delete*
                  - s3:Put*
                  - s3:Replicate*
                  - s3:Restore*
                  - s3:Update*
                  - securityhub:BatchImport*
                  - securityhub:BatchUpdate*
                  - securityhub:Delete*
                  - securityhub:Disable*
                  - securityhub:Update*
                  - wafv2:Delete*
                  - wafv2:Put*
                  - wafv2:Update*
              - Sid: NuncaAmpliarOProprioAcesso
                Effect: Deny
                Resource: '*'
                Action:
                  - iam:Add*
                  - iam:Attach*
                  - iam:Create*
                  - iam:Delete*
                  - iam:Detach*
                  - iam:PassRole
                  - iam:Put*
                  - iam:Remove*
                  - iam:Set*
                  - iam:Update*
                  - iam:Upload*
                  - sts:AssumeRole
                  - sts:AssumeRoleWithSAML
                  - sts:AssumeRoleWithWebIdentity
                  - sts:GetFederationToken

Outputs:
  RoleArn:
    Description: ARN do papel de leitura. Informe no painel da Verax.
    Value: !GetAtt VeraxReadOnlyRole.Arn
