AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Verax Control - usuário IAM somente leitura (verax-control-reader), sem chave e sem senha, com o grupo e duas
  políticas: a de leitura, que também é o limite de permissões do usuário, e a de negação, que barra qualquer chamada
  de fora do IP do nó, qualquer alteração de logs e qualquer ampliação do próprio acesso. A trilha do CloudTrail e o
  export do GuardDuty só são criados se pedidos (o padrão é não). O WAF nunca é alterado.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: { default: De onde o Verax Control lê (o nó) }
        Parameters: [NodeEgressIps]
      - Label: { default: Logs que o Verax Control lê (já existentes nesta conta) }
        Parameters: [LogBucketArns, LogKmsKeyArns, LogObjectPrefix]
      - Label: { default: 'Opcional: criar a trilha e o export do GuardDuty (o padrão é não)' }
        Parameters: [CreateTrail, EnableGuardDutyExport, GuardDutyDetectorId, LogRetentionDays]
      - Label: { default: Só num incidente }
        Parameters: [RevokeSessionsIssuedBefore]
    ParameterLabels:
      NodeEgressIps: { default: IP de saída do nó (informado pela Verax) }
      LogBucketArns: { default: Buckets S3 de log }
      LogKmsKeyArns: { default: Chaves KMS dos buckets de log }
      LogObjectPrefix: { default: Prefixo dos objetos (bucket com logs de várias contas) }
      CreateTrail: { default: Criar uma trilha do CloudTrail }
      EnableGuardDutyExport: { default: Exportar os findings do GuardDuty para S3 }
      GuardDutyDetectorId: { default: ID do detector do GuardDuty já ativo }
      LogRetentionDays: { default: Dias de retenção nos buckets criados }
      RevokeSessionsIssuedBefore: { default: Negar sessões emitidas antes de (UTC) }

Parameters:
  NodeEgressIps:
    Type: CommaDelimitedList
    Description: >-
      IP de saída do nó do Verax Control, com /32 (vários separados por vírgula). Toda chamada à AWS feita com a chave
      deste usuário a partir de qualquer outro IP é negada. Obrigatório.
    AllowedPattern: '^(25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])(\.(25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])){3}/32$'
    ConstraintDescription: IPv4 com /32, como 203.0.113.10/32.
  LogBucketArns:
    Type: CommaDelimitedList
    Description: >-
      ARNs dos buckets S3 de log já existentes que o usuário lê (CloudTrail, export do GuardDuty e logs do WAF em
      aws-waf-logs-*), separados por vírgula. Vazio não libera nenhum.
    Default: ''
    AllowedPattern: '^$|^arn:aws[a-z-]*:s3:::[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$'
    ConstraintDescription: 'arn:aws:s3:::<bucket>'
  LogKmsKeyArns:
    Type: CommaDelimitedList
    Description: >-
      ARNs das chaves KMS que cifram os buckets acima (SSE-KMS; o export do GuardDuty sempre usa uma), separados por
      vírgula. O usuário só decifra pelo S3. Vazio se os buckets usam a cifragem padrão do S3.
    Default: ''
    AllowedPattern: '^$|^arn:aws[a-z-]*:kms:[a-z0-9-]+:[0-9]{12}:key/[a-f0-9-]{36}$'
    ConstraintDescription: 'arn:aws:kms:<região>:<conta>:key/<id>'
  LogObjectPrefix:
    Type: CommaDelimitedList
    Description: >-
      Opcional. Só para um bucket que recebe logs de várias contas (por exemplo, a trilha da organização): o usuário só
      lê, nos buckets informados acima, os objetos com um destes prefixos, terminados em / e separados por vírgula,
      como AWSLogs/o-exemplo123/111111111111/,AWSLogs/111111111111/. Vazio libera os buckets inteiros.
    Default: ''
    AllowedPattern: '^$|^[A-Za-z0-9_.-]+(/[A-Za-z0-9_.-]+)*/$'
    ConstraintDescription: segmentos com letras, números, _, . ou -, separados e terminados por /.
  CreateTrail:
    Type: String
    Description: >-
      true cria uma trilha multi-região com validação de integridade, num bucket e numa chave KMS novos desta pilha.
      Use só se a conta não tiver trilha: uma segunda trilha dos mesmos eventos é cobrada pela AWS.
    AllowedValues: ['true', 'false']
    Default: 'false'
  EnableGuardDutyExport:
    Type: String
    Description: >-
      true exporta os findings do detector informado abaixo (desta região) para um bucket e uma chave KMS novos desta
      pilha. Não ativa o GuardDuty.
    AllowedValues: ['true', 'false']
    Default: 'false'
  GuardDutyDetectorId:
    Type: String
    Description: Só com o export ligado. ID do detector do GuardDuty já ativo nesta região (aws guardduty list-detectors).
    Default: ''
    AllowedPattern: '^$|^[a-z0-9]{32}$'
    ConstraintDescription: 32 letras minúsculas ou números.
  LogRetentionDays:
    Type: Number
    Description: Por quantos dias os logs ficam nos buckets criados por esta pilha. Não muda nenhum bucket existente.
    Default: 365
    MinValue: 90
    MaxValue: 3650
  RevokeSessionsIssuedBefore:
    Type: String
    Description: >-
      Só num incidente. Data e hora em UTC, como 2026-11-04T18:00:00Z: nega toda sessão temporária deste usuário
      (GetSessionToken) emitida antes dela. A chave em si não é afetada: desative-a ou exclua-a no console. Vazio não
      nega nada.
    Default: ''
    AllowedPattern: '^$|^[0-9]{4}-(0[1-9]|1[0-2])-(0[1-9]|[12][0-9]|3[01])T([01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9]Z$'
    ConstraintDescription: AAAA-MM-DDThh:mm:ssZ, em UTC.

Rules:
  # O IP do nó é obrigatório: sem ele, a chave valeria de qualquer lugar.
  IpDoNoObrigatorio:
    Assertions:
      - Assert: !Not [!EachMemberIn [!Ref NodeEgressIps, ['']]]
        AssertDescription: Informe o IP de saída do nó (NodeEgressIps), com /32.
  # Uma vírgula sobrando vira um item vazio: num prefixo, ele liberaria o bucket inteiro.
  ListasSemItemVazio:
    Assertions:
      - Assert: !Or [!EachMemberEquals [!Ref LogBucketArns, ''], !Not [!Contains [!Ref LogBucketArns, '']]]
        AssertDescription: LogBucketArns tem um item vazio (vírgula sobrando).
      - Assert: !Or [!EachMemberEquals [!Ref LogKmsKeyArns, ''], !Not [!Contains [!Ref LogKmsKeyArns, '']]]
        AssertDescription: LogKmsKeyArns tem um item vazio (vírgula sobrando).
      - Assert:
          !Or [!EachMemberEquals [!Ref LogObjectPrefix, ''], !Not [!Contains [!Ref LogObjectPrefix, '']]]
        AssertDescription: LogObjectPrefix tem um item vazio (vírgula sobrando).
  ExportPrecisaDoDetector:
    RuleCondition: !Equals [!Ref EnableGuardDutyExport, 'true']
    Assertions:
      - Assert: !Not [!Equals [!Ref GuardDutyDetectorId, '']]
        AssertDescription: >-
          Para exportar os findings, informe o ID do detector do GuardDuty já ativo nesta região. A pilha não ativa o
          GuardDuty.

Conditions:
  HasLogBuckets: !Not [!Equals [!Join ['', !Ref LogBucketArns], '']]
  DecryptsLogBuckets: !And
    - !Condition HasLogBuckets
    - !Not [!Equals [!Join ['', !Ref LogKmsKeyArns], '']]
  HasObjectPrefix: !Not [!Equals [!Join ['', !Ref LogObjectPrefix], '']]
  CreatesTrail: !Equals [!Ref CreateTrail, 'true']
  ExportsGuardDuty: !Equals [!Ref EnableGuardDutyExport, 'true']
  CreatesLogBucket: !Or
    - !Condition CreatesTrail
    - !Condition ExportsGuardDuty
  RevokesSessions: !Not [!Equals [!Ref RevokeSessionsIssuedBefore, '']]

Resources:
  # --- Usuário de leitura ---

  # Leitura mínima. Também é o limite de permissões (PermissionsBoundary) do usuário: uma política que alguém anexe
  # depois não passa do que está aqui.
  ReaderPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: VeraxControlReader
      Path: /verax/
      Description: Verax Control - leitura dos logs informados, conferência das fontes e configuração (Ativos e Postura).
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          # Os buckets e as chaves que o cliente informou, já existentes. O Wazuh do nó lista e lê os objetos;
          # GetBucketLocation foi conferido no módulo aws-s3 do Wazuh 4.14.9.
          - !If
            - HasLogBuckets
            - Sid: ListarBucketsDeLog
              Effect: Allow
              Action: [s3:ListBucket, s3:GetBucketLocation]
              Resource: !Ref LogBucketArns
            - !Ref AWS::NoValue
          - !If
            - HasLogBuckets
            # Os objetos de cada bucket: <arn>/* para cada ARN da lista. Os prefixos opcionais ficam na negação.
            - Sid: LerObjetosDeLog
              Effect: Allow
              Action: s3:GetObject
              Resource: !Split [',', !Join ['', [!Join ['/*,', !Ref LogBucketArns], '/*']]]
            - !Ref AWS::NoValue
          - !If
            - DecryptsLogBuckets
            - Sid: DecifrarSoPeloS3
              Effect: Allow
              Action: kms:Decrypt
              Resource: !Ref LogKmsKeyArns
              Condition:
                StringLike:
                  kms:ViaService: 's3.*.amazonaws.com'
            - !Ref AWS::NoValue
          # Os buckets e a chave criados por esta pilha, se o cliente pediu a trilha ou o export.
          - !If
            - CreatesLogBucket
            - Sid: ListarBucketsCriados
              Effect: Allow
              Action: [s3:ListBucket, s3:GetBucketLocation]
              Resource:
                - !If [CreatesTrail, !GetAtt TrailBucket.Arn, !Ref AWS::NoValue]
                - !If [ExportsGuardDuty, !GetAtt GuardDutyBucket.Arn, !Ref AWS::NoValue]
            - !Ref AWS::NoValue
          - !If
            - CreatesLogBucket
            - Sid: LerObjetosCriados
              Effect: Allow
              Action: s3:GetObject
              Resource:
                - !If [CreatesTrail, !Sub '${TrailBucket.Arn}/*', !Ref AWS::NoValue]
                - !If [ExportsGuardDuty, !Sub '${GuardDutyBucket.Arn}/*', !Ref AWS::NoValue]
            - !Ref AWS::NoValue
          - !If
            - CreatesLogBucket
            - Sid: DecifrarCriadosSoPeloS3
              Effect: Allow
              Action: kms:Decrypt
              Resource: !GetAtt LogsKey.Arn
              Condition:
                StringEquals:
                  kms:ViaService: !Sub 's3.${AWS::Region}.amazonaws.com'
            - !Ref AWS::NoValue
          # O painel confere que a chave colada não tem permissão demais (só este usuário, nunca outro).
          - Sid: AutoInspecao
            Effect: Allow
            Action: iam:SimulatePrincipalPolicy
            Resource: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:user/verax/verax-control-reader'
          # Confere que a trilha e o export do GuardDuty gravam nos buckets cadastrados.
          - Sid: ValidarFontes
            Effect: Allow
            Resource: '*'
            Action:
              - cloudtrail:DescribeTrails
              - cloudtrail:GetTrailStatus
              - guardduty:ListDetectors
              - guardduty:GetDetector
              - guardduty:ListPublishingDestinations
              - guardduty:DescribePublishingDestination
          # Ativos e Postura: usuários, chaves e MFA do IAM, instâncias e grupos de segurança do EC2, e a exposição dos
          # buckets. Sem SecurityAudit e sem GenerateCredentialReport (que cria o relatório na conta).
          - Sid: PosturaEAtivos
            Effect: Allow
            Resource: '*'
            Action:
              - iam:GetAccountSummary
              - iam:GetAccountPasswordPolicy
              - iam:ListUsers
              - iam:ListAccessKeys
              - iam:GetAccessKeyLastUsed
              - iam:ListMFADevices
              - iam:GetLoginProfile
              - ec2:DescribeRegions
              - ec2:DescribeInstances
              - ec2:DescribeSecurityGroups
              - ec2:GetEbsEncryptionByDefault
              - s3:ListAllMyBuckets
              - s3:GetBucketAcl
              - s3:GetBucketPolicyStatus
              - s3:GetBucketPublicAccessBlock
              - s3:GetAccountPublicAccessBlock

  # Negações explícitas: valem mesmo que alguém anexe outra política ao usuário ou ao grupo.
  GuardrailsPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: VeraxControlGuardrails
      Path: /verax/
      Description: Verax Control - nega chamadas de fora do IP do nó, alteração de logs e ampliação do próprio acesso.
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          # A chave só vale a partir do IP do nó. A leitura cifrada continua: o S3 decifra no KMS numa sessão de acesso
          # encaminhada, que preserva o IP de quem chamou o S3. O GetCallerIdentity não pode ser negado.
          - Sid: SoDoNoDaVerax
            Effect: Deny
            Action: '*'
            Resource: '*'
            Condition:
              NotIpAddress:
                aws:SourceIp: !Ref NodeEgressIps
          # Ações que poderiam apagar, desligar ou desviar logs e findings (a mesma lista do conector).
          - Sid: NuncaAlterarLogs
            Effect: Deny
            Resource: '*'
            Action:
              - access-analyzer:Delete*
              - access-analyzer:Update*
              - cloudtrail:Create*
              - cloudtrail:Delete*
              - cloudtrail:Put*
              - cloudtrail:Stop*
              - cloudtrail:Update*
              - guardduty:Archive*
              - guardduty:Create*
              - guardduty:Delete*
              - guardduty:Disable*
              - guardduty:Disassociate*
              - guardduty:Update*
              - inspector2:Delete*
              - inspector2:Disable*
              - inspector2:Update*
              - kms:Delete*
              - kms:Disable*
              - kms:Put*
              - kms:ScheduleKeyDeletion
              - kms:Update*
              - logs:Associate*
              - logs:Create*
              - logs:Delete*
              - logs:Disassociate*
              - logs:Put*
              - logs:Tag*
              - logs:Unmask
              - logs:Untag*
              - logs:Update*
              - s3:Abort*
              - s3:Bypass*
              - s3:Create*
              - s3:Delete*
              - s3:Put*
              - s3:Replicate*
              - s3:Restore*
              - s3:Update*
              - securityhub:BatchImport*
              - securityhub:BatchUpdate*
              - securityhub:Delete*
              - securityhub:Disable*
              - securityhub:Update*
              - wafv2:Delete*
              - wafv2:Put*
              - wafv2:Update*
          # Nem o próprio usuário: sem criar, trocar ou apagar chaves (nem a dele), políticas, grupos ou papéis.
          - Sid: NuncaAmpliarOProprioAcesso
            Effect: Deny
            Resource: '*'
            Action:
              - iam:Add*
              - iam:Attach*
              - iam:Create*
              - iam:Delete*
              - iam:Detach*
              - iam:PassRole
              - iam:Put*
              - iam:Remove*
              - iam:Set*
              - iam:Update*
              - iam:Upload*
              - sts:AssumeRole
              - sts:AssumeRoleWithSAML
              - sts:AssumeRoleWithWebIdentity
              - sts:GetFederationToken
          # Com os prefixos, só os objetos que começam com um deles (arn:*:s3:::*/<prefixo>*, para cada prefixo). O IAM
          # não cruza a lista de buckets com a de prefixos, então o * antes da / vale para qualquer bucket: um objeto com
          # o prefixo mais adiante no nome também passa, e os logs gravados pela AWS nunca têm o caminho de outra conta
          # assim. Os buckets criados por esta pilha são só desta conta e ficam fora da regra.
          - !If
            - HasObjectPrefix
            - Sid: SoOsPrefixosInformados
              Effect: Deny
              Action: s3:GetObject
              NotResource: !Split
                - ','
                - !Join
                  - ''
                  - - 'arn:*:s3:::*/'
                    - !Join ['*,arn:*:s3:::*/', !Ref LogObjectPrefix]
                    - '*'
                    - !If [CreatesTrail, !Sub ',${TrailBucket.Arn}/*', '']
                    - !If [ExportsGuardDuty, !Sub ',${GuardDutyBucket.Arn}/*', '']
            - !Ref AWS::NoValue
          # Incidente: sessões temporárias (GetSessionToken) sobrevivem à exclusão da chave. A chave em si não tem
          # aws:TokenIssueTime e não é afetada.
          - !If
            - RevokesSessions
            - Sid: RevogarSessoesAntigas
              Effect: Deny
              Action: '*'
              Resource: '*'
              Condition:
                DateLessThan:
                  aws:TokenIssueTime: !Ref RevokeSessionsIssuedBefore
            - !Ref AWS::NoValue

  ReadersGroup:
    Type: AWS::IAM::Group
    Properties:
      GroupName: VeraxControlReaders
      Path: /verax/
      ManagedPolicyArns:
        - !Ref ReaderPolicy
        - !Ref GuardrailsPolicy

  # Sem chave (AWS::IAM::AccessKey) e sem senha (LoginProfile): o cliente cria a chave no console, e o segredo nunca
  # aparece numa saída da pilha.
  ReaderUser:
    Type: AWS::IAM::User
    Properties:
      UserName: verax-control-reader
      Path: /verax/
      PermissionsBoundary: !Ref ReaderPolicy
      Groups:
        - !Ref ReadersGroup

  # --- Opcional: trilha e export do GuardDuty (do conector T4.3) ---

  LogsKey:
    Type: AWS::KMS::Key
    Condition: CreatesLogBucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: Verax Control - cifra a trilha do CloudTrail e o export do GuardDuty criados pela pilha
      EnableKeyRotation: true
      PendingWindowInDays: 30
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: AdministracaoPelaConta
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:root'
            Action: kms:*
            Resource: '*'
          - Sid: CloudTrailCifra
            Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action: kms:GenerateDataKey*
            Resource: '*'
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              StringLike:
                kms:EncryptionContext:aws:cloudtrail:arn: !Sub 'arn:${AWS::Partition}:cloudtrail:*:${AWS::AccountId}:trail/*'
          - Sid: CloudTrailDescreveChave
            Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action: kms:DescribeKey
            Resource: '*'
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
          - Sid: GuardDutyCifra
            Effect: Allow
            Principal:
              Service: guardduty.amazonaws.com
            Action: kms:GenerateDataKey
            Resource: '*'
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnLike:
                aws:SourceArn: !Sub 'arn:${AWS::Partition}:guardduty:*:${AWS::AccountId}:detector/*'

  LogsKeyAlias:
    Type: AWS::KMS::Alias
    Condition: CreatesLogBucket
    Properties:
      AliasName: alias/verax-control-logs
      TargetKeyId: !Ref LogsKey

  # Log de acesso dos buckets de log (CIS: acesso ao bucket do CloudTrail registrado).
  AccessLogsBucket:
    Type: AWS::S3::Bucket
    Condition: CreatesLogBucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_18
            comment: É o próprio destino dos logs de acesso; registrar o acesso a ele criaria um ciclo.
    Properties:
      BucketName: !Sub 'verax-control-access-logs-${AWS::AccountId}-${AWS::Region}'
      # O log de acesso do S3 só é entregue em bucket com SSE-S3 (não aceita SSE-KMS).
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: retencao
            Status: Enabled
            ExpirationInDays: !Ref LogRetentionDays
            NoncurrentVersionExpiration:
              NoncurrentDays: 30
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7

  AccessLogsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Condition: CreatesLogBucket
    Properties:
      Bucket: !Ref AccessLogsBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: SomenteTLS
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource: [!GetAtt AccessLogsBucket.Arn, !Sub '${AccessLogsBucket.Arn}/*']
            Condition:
              Bool:
                aws:SecureTransport: 'false'
          - Sid: LogDeAcessoDosBucketsDaPilha
            Effect: Allow
            Principal:
              Service: logging.s3.amazonaws.com
            Action: s3:PutObject
            Resource: !Sub '${AccessLogsBucket.Arn}/*'
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnLike:
                aws:SourceArn: !Sub 'arn:${AWS::Partition}:s3:::verax-control-*-${AWS::AccountId}-${AWS::Region}'

  TrailBucket:
    Type: AWS::S3::Bucket
    Condition: CreatesTrail
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub 'verax-control-cloudtrail-${AWS::AccountId}-${AWS::Region}'
      LoggingConfiguration:
        DestinationBucketName: !Ref AccessLogsBucket
        LogFilePrefix: cloudtrail/
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - BucketKeyEnabled: true
            ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
              KMSMasterKeyID: !GetAtt LogsKey.Arn
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: retencao
            Status: Enabled
            ExpirationInDays: !Ref LogRetentionDays
            NoncurrentVersionExpiration:
              NoncurrentDays: 30
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7

  TrailBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Condition: CreatesTrail
    Properties:
      Bucket: !Ref TrailBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: SomenteTLS
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource: [!GetAtt TrailBucket.Arn, !Sub '${TrailBucket.Arn}/*']
            Condition:
              Bool:
                aws:SecureTransport: 'false'
          - Sid: CloudTrailConfereAcl
            Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action: s3:GetBucketAcl
            Resource: !GetAtt TrailBucket.Arn
            Condition:
              StringEquals:
                aws:SourceArn: !Sub 'arn:${AWS::Partition}:cloudtrail:${AWS::Region}:${AWS::AccountId}:trail/verax-control'
          - Sid: CloudTrailGrava
            Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action: s3:PutObject
            Resource: !Sub '${TrailBucket.Arn}/AWSLogs/${AWS::AccountId}/*'
            Condition:
              StringEquals:
                s3:x-amz-acl: bucket-owner-full-control
                aws:SourceArn: !Sub 'arn:${AWS::Partition}:cloudtrail:${AWS::Region}:${AWS::AccountId}:trail/verax-control'

  # Falso positivo do Trivy (AWS-0015): o adaptador dele lê `KmsKeyId`, mas o esquema do CloudFormation exige
  # `KMSKeyId`, que está definido abaixo com a chave da pilha (conferido em tests/test_reader.py).
  # trivy:ignore:AWS-0015
  Trail:
    Type: AWS::CloudTrail::Trail
    Condition: CreatesTrail
    DependsOn: TrailBucketPolicy
    Properties:
      TrailName: verax-control
      S3BucketName: !Ref TrailBucket
      KMSKeyId: !GetAtt LogsKey.Arn
      IsLogging: true
      IsMultiRegionTrail: true
      IncludeGlobalServiceEvents: true
      EnableLogFileValidation: true

  GuardDutyBucket:
    Type: AWS::S3::Bucket
    Condition: ExportsGuardDuty
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub 'verax-control-guardduty-${AWS::AccountId}-${AWS::Region}'
      LoggingConfiguration:
        DestinationBucketName: !Ref AccessLogsBucket
        LogFilePrefix: guardduty/
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - BucketKeyEnabled: true
            ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
              KMSMasterKeyID: !GetAtt LogsKey.Arn
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: retencao
            Status: Enabled
            ExpirationInDays: !Ref LogRetentionDays
            NoncurrentVersionExpiration:
              NoncurrentDays: 30
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7

  GuardDutyBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Condition: ExportsGuardDuty
    Properties:
      Bucket: !Ref GuardDutyBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: SomenteTLS
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource: [!GetAtt GuardDutyBucket.Arn, !Sub '${GuardDutyBucket.Arn}/*']
            Condition:
              Bool:
                aws:SecureTransport: 'false'
          - Sid: GuardDutyLocalizaBucket
            Effect: Allow
            Principal:
              Service: guardduty.amazonaws.com
            Action: s3:GetBucketLocation
            Resource: !GetAtt GuardDutyBucket.Arn
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnLike:
                aws:SourceArn: !Sub 'arn:${AWS::Partition}:guardduty:*:${AWS::AccountId}:detector/*'
          - Sid: GuardDutyGrava
            Effect: Allow
            Principal:
              Service: guardduty.amazonaws.com
            Action: s3:PutObject
            Resource: !Sub '${GuardDutyBucket.Arn}/*'
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnLike:
                aws:SourceArn: !Sub 'arn:${AWS::Partition}:guardduty:*:${AWS::AccountId}:detector/*'
          - Sid: GuardDutySoComAChaveDaPilha
            Effect: Deny
            Principal:
              Service: guardduty.amazonaws.com
            Action: s3:PutObject
            Resource: !Sub '${GuardDutyBucket.Arn}/*'
            Condition:
              StringNotEquals:
                s3:x-amz-server-side-encryption-aws-kms-key-id: !GetAtt LogsKey.Arn

  # Só o destino do detector que já existe: a pilha não ativa nem altera o GuardDuty.
  GuardDutyExport:
    Type: AWS::GuardDuty::PublishingDestination
    Condition: ExportsGuardDuty
    DependsOn: GuardDutyBucketPolicy
    Metadata:
      cfn-lint:
        config:
          # Falso positivo: o cfn-lint resolve o Ref pelo padrão vazio, mas com o export ligado a regra
          # ExportPrecisaDoDetector recusa o ID vazio antes de criar qualquer recurso.
          ignore_checks: [W1030]
    Properties:
      DetectorId: !Ref GuardDutyDetectorId
      DestinationType: S3
      DestinationProperties:
        DestinationArn: !GetAtt GuardDutyBucket.Arn
        KmsKeyArn: !GetAtt LogsKey.Arn

Outputs:
  UserArn:
    Description: ARN do usuário de leitura. O painel confere este ARN quando a chave é colada.
    Value: !GetAtt ReaderUser.Arn
  SecurityCredentialsUrl:
    Description: >-
      Aba "Security credentials" do usuário: crie a chave em "Create access key", no caso de uso "Application running
      outside AWS", e cole no painel. O segredo aparece só nessa tela, nunca na pilha.
    Value: !Sub 'https://console.aws.amazon.com/iam/home#/users/details/${ReaderUser}?section=security_credentials'
  TrailBucketArn:
    Condition: CreatesTrail
    Description: Bucket da trilha criada pela pilha (cadastre no painel).
    Value: !GetAtt TrailBucket.Arn
  GuardDutyBucketArn:
    Condition: ExportsGuardDuty
    Description: Bucket do export do GuardDuty criado pela pilha (cadastre no painel).
    Value: !GetAtt GuardDutyBucket.Arn
  LogsKeyArn:
    Condition: CreatesLogBucket
    Description: Chave KMS que cifra os buckets criados pela pilha.
    Value: !GetAtt LogsKey.Arn
