AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Verax Control - papel IAM de leitura (verax-control-reader), sem chave: só o nó do Verax Control entra nele, com
  um token do Google para a conta de serviço do nó, e só do IP de saída do nó. Lê só o que você autorizar: os logs da
  AWS em AWSLogs/<esta conta>/, os achados de segurança e os grupos do CloudWatch Logs com a etiqueta
  verax-control=leitura. A política de leitura é também o limite do papel; a de negação barra chamadas de fora do IP
  do nó, alteração de logs e ampliação do próprio acesso. Trilha, export do GuardDuty e o log de acesso dos ALB (que o
  painel liga a seu pedido, num bucket novo) só se pedidos (o padrão é não); fora isso, nada que existe é alterado.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: { default: Quem entra no papel (o nó do Verax Control; os valores vêm do painel) }
        Parameters: [NodeServiceAccountId, NodeEgressIps, Audience]
      - Label: { default: 'O que o Verax Control pode ler (true autoriza; false não dá a permissão)' }
        Parameters: [ReadAwsServiceLogs, ReadSecurityFindings, ReadTaggedLogGroups]
      - Label: { default: 'Opcional: buckets adicionais, fora do padrão AWSLogs' }
        Parameters: [LogBucketArns, LogKmsKeyArns, LogObjectPrefix]
      - Label: { default: 'Opcional: criar a trilha e o export do GuardDuty (o padrão é não)' }
        Parameters: [CreateTrail, EnableGuardDutyExport, GuardDutyDetectorId, LogRetentionDays]
      - Label: { default: 'Opcional: o Verax Control liga o log de acesso dos ALB (o padrão é não)' }
        Parameters: [EnableAlbAccessLogs]
    ParameterLabels:
      NodeServiceAccountId: { default: ID da conta de serviço do nó (informado pelo painel) }
      NodeEgressIps: { default: IP de saída do nó (informado pelo painel) }
      Audience: { default: Audience do token do nó (já preenchido; confira com o painel) }
      ReadAwsServiceLogs: { default: Ler os logs que a AWS grava no S3 para esta conta }
      ReadSecurityFindings: { default: Ler os achados de segurança }
      ReadTaggedLogGroups: { default: Ler os grupos do CloudWatch Logs que você etiquetar }
      LogBucketArns: { default: 'Buckets adicionais, fora do padrão AWSLogs' }
      LogKmsKeyArns: { default: Chaves KMS dos buckets adicionais }
      LogObjectPrefix: { default: Prefixo dos objetos nos buckets adicionais (logs de várias contas) }
      CreateTrail: { default: Criar uma trilha do CloudTrail }
      EnableGuardDutyExport: { default: Exportar os findings do GuardDuty para S3 }
      GuardDutyDetectorId: { default: ID do detector do GuardDuty já ativo }
      LogRetentionDays: { default: Dias de retenção nos buckets criados }
      EnableAlbAccessLogs: { default: Deixar o painel ligar o log de acesso dos ALB desta região }

Parameters:
  NodeServiceAccountId:
    Type: String
    Description: >-
      ID único (21 dígitos) da conta de serviço do nó do Verax Control no Google, informado pelo painel. Não é segredo:
      o papel só aceita um token que o Google assina para esta conta, e ninguém o forja. Obrigatório.
    AllowedPattern: '^[0-9]{21}$'
    ConstraintDescription: 21 dígitos, como 123456789012345678901.
  NodeEgressIps:
    Type: String
    Description: >-
      IP de saída do nó do Verax Control, com /32 (até 4, separados por vírgula), informado pelo painel. O papel só é
      assumido a partir dele, e toda chamada à AWS feita com o papel de qualquer outro IP é negada. Obrigatório.
    AllowedPattern: '^(25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])(\.(25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])){3}/32(,(25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])(\.(25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])){3}/32){0,3}$'
    ConstraintDescription: de 1 a 4 IPv4 com /32, separados por vírgula e sem espaço, como 203.0.113.10/32.
  Audience:
    Type: String
    Description: >-
      O destinatário (audience) que o nó pede ao Google ao emitir o token. É o mesmo para todo cliente do Verax
      Control: deixe o valor que já vem preenchido. Um token emitido para outro destino não entra no papel.
    Default: https://control.veraxsistemas.com.br/aws-reader
    AllowedPattern: '^https://[a-z0-9.-]+(/[A-Za-z0-9._-]+)*$'
    ConstraintDescription: um endereço https sem curinga, como o que já vem preenchido.
  ReadAwsServiceLogs:
    Type: String
    Description: >-
      true deixa o papel ler, em qualquer bucket S3, só os objetos que ficam em AWSLogs/<ID desta conta>/ (ou em
      AWSLogs/o-<organização>/<ID desta conta>/, na trilha de organização): CloudTrail, VPC Flow Logs, WAF, export do
      GuardDuty, balanceadores e Config. Você não informa nenhum bucket. Para achar essa pasta, o papel também vê os
      nomes do primeiro nível de cada bucket, sem ler o conteúdo. false não dá nenhuma dessas permissões.
    AllowedValues: ['true', 'false']
    Default: 'true'
  ReadSecurityFindings:
    Type: String
    Description: >-
      true deixa o papel ler os achados de segurança do GuardDuty, do Security Hub, do Inspector e do IAM Access
      Analyzer, pela API de cada um. O papel não ativa nenhum desses serviços e não altera nem arquiva achados. false
      não dá essa permissão.
    AllowedValues: ['true', 'false']
    Default: 'true'
  ReadTaggedLogGroups:
    Type: String
    Description: >-
      true deixa o papel ler o conteúdo dos grupos do CloudWatch Logs que tiverem a etiqueta verax-control com o valor
      leitura, e de nenhum outro. Quem põe e tira a etiqueta é você, grupo a grupo. false não dá essa permissão.
    AllowedValues: ['true', 'false']
    Default: 'true'
  LogBucketArns:
    Type: CommaDelimitedList
    Description: >-
      Só para logs fora do padrão AWSLogs/<ID desta conta>/: um prefixo próprio antes de AWSLogs, VPC Flow Logs em
      formato Hive, entregas do Firehose ou um bucket central com outro layout. ARNs dos buckets que o papel lista e lê
      inteiros, separados por vírgula. Vazio não libera nenhum bucket além do padrão.
    Default: ''
    AllowedPattern: '^$|^arn:aws[a-z-]*:s3:::[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$'
    ConstraintDescription: 'arn:aws:s3:::<bucket>'
  LogKmsKeyArns:
    Type: CommaDelimitedList
    Description: >-
      ARNs das chaves KMS que cifram os buckets adicionais acima (SSE-KMS), separados por vírgula; chave comum ou
      multirregião (key/mrk-...). O papel só decifra pelo S3. Vazio se eles usam a cifragem padrão do S3, ou se a
      leitura dos logs da AWS está autorizada (ela já decifra, só pelo S3, o que o papel pode ler).
    Default: ''
    AllowedPattern: '^$|^arn:aws[a-z-]*:kms:[a-z0-9-]+:[0-9]{12}:key/([a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}|mrk-[a-f0-9]{32})$'
    ConstraintDescription: 'arn:aws:kms:<região>:<conta>:key/<id>, com o id comum (UUID) ou multirregião (mrk-...)'
  LogObjectPrefix:
    Type: CommaDelimitedList
    Description: >-
      Opcional. Só para um bucket adicional que recebe logs de várias contas: o papel só lê, nos buckets adicionais
      acima, os objetos com um destes prefixos, terminados em / e separados por vírgula, como
      logs-centrais/AWSLogs/111111111111/. Vazio libera os buckets adicionais inteiros.
    Default: ''
    AllowedPattern: '^$|^[A-Za-z0-9_.-]+(/[A-Za-z0-9_.-]+)*/$'
    ConstraintDescription: segmentos com letras, números, _, . ou -, separados e terminados por /.
  CreateTrail:
    Type: String
    Description: >-
      true cria uma trilha multi-região com validação de integridade, num bucket e numa chave KMS novos desta pilha.
      Use só se a conta não tiver trilha: uma segunda trilha dos mesmos eventos é cobrada pela AWS.
    AllowedValues: ['true', 'false']
    Default: 'false'
  EnableGuardDutyExport:
    Type: String
    Description: >-
      true exporta os findings do detector informado abaixo (desta região) para um bucket e uma chave KMS novos desta
      pilha. Não ativa o GuardDuty.
    AllowedValues: ['true', 'false']
    Default: 'false'
  GuardDutyDetectorId:
    Type: String
    Description: Só com o export ligado. ID do detector do GuardDuty já ativo nesta região (aws guardduty list-detectors).
    Default: ''
    AllowedPattern: '^$|^[a-z0-9]{32}$'
    ConstraintDescription: 32 letras minúsculas ou números.
  LogRetentionDays:
    Type: Number
    Description: Por quantos dias os logs ficam nos buckets criados por esta pilha. Não muda nenhum bucket existente.
    Default: 365
    MinValue: 90
    MaxValue: 3650
  EnableAlbAccessLogs:
    Type: String
    Description: >-
      true cria um bucket privado (SSE-S3) para o log de acesso dos ALB desta região e deixa o papel mudar os atributos
      de um ALB desta região: o painel liga só o log, de um ALB por vez, quando alguém pede. false não dá a permissão.
    AllowedValues: ['true', 'false']
    Default: 'false'

Rules:
  # Quem entra é obrigatório: sem a conta de serviço, o papel não teria a quem confiar, e sem o IP, um token vazado
  # entraria de qualquer lugar. Os padrões dos parâmetros já recusam o vazio; a regra é a segunda trava.
  NoDaVeraxObrigatorio:
    Assertions:
      - Assert: !Not [!Equals [!Ref NodeServiceAccountId, '']]
        AssertDescription: Informe o ID da conta de serviço do nó (NodeServiceAccountId), que o painel mostra.
      - Assert: !Not [!Equals [!Ref NodeEgressIps, '']]
        AssertDescription: Informe o IP de saída do nó (NodeEgressIps), com /32.
      - Assert: !Not [!Equals [!Ref Audience, '']]
        AssertDescription: Deixe o audience (Audience) com o valor que já vem preenchido.
  # Uma vírgula sobrando vira um item vazio: num prefixo, ele liberaria o bucket inteiro.
  ListasSemItemVazio:
    Assertions:
      - Assert: !Or [!EachMemberEquals [!Ref LogBucketArns, ''], !Not [!Contains [!Ref LogBucketArns, '']]]
        AssertDescription: LogBucketArns tem um item vazio (vírgula sobrando).
      - Assert: !Or [!EachMemberEquals [!Ref LogKmsKeyArns, ''], !Not [!Contains [!Ref LogKmsKeyArns, '']]]
        AssertDescription: LogKmsKeyArns tem um item vazio (vírgula sobrando).
      - Assert:
          !Or [!EachMemberEquals [!Ref LogObjectPrefix, ''], !Not [!Contains [!Ref LogObjectPrefix, '']]]
        AssertDescription: LogObjectPrefix tem um item vazio (vírgula sobrando).
  ExportPrecisaDoDetector:
    RuleCondition: !Equals [!Ref EnableGuardDutyExport, 'true']
    Assertions:
      - Assert: !Not [!Equals [!Ref GuardDutyDetectorId, '']]
        AssertDescription: >-
          Para exportar os findings, informe o ID do detector do GuardDuty já ativo nesta região. A pilha não ativa o
          GuardDuty.

Conditions:
  ReadsServiceLogs: !Equals [!Ref ReadAwsServiceLogs, 'true']
  ReadsFindings: !Equals [!Ref ReadSecurityFindings, 'true']
  ReadsLogGroups: !Equals [!Ref ReadTaggedLogGroups, 'true']
  HasLogBuckets: !Not [!Equals [!Join ['', !Ref LogBucketArns], '']]
  # A lista de chaves só entra na política sem a leitura dos logs da AWS: com ela, o Decrypt pelo S3 já vale para a
  # chave de qualquer objeto que o papel lê, e repetir a lista só aproximaria a política do limite de tamanho do IAM.
  DecryptsLogBuckets: !And
    - !Condition HasLogBuckets
    - !Not [!Equals [!Join ['', !Ref LogKmsKeyArns], '']]
    - !Not [!Condition ReadsServiceLogs]
  HasObjectPrefix: !Not [!Equals [!Join ['', !Ref LogObjectPrefix], '']]
  CreatesTrail: !Equals [!Ref CreateTrail, 'true']
  ExportsGuardDuty: !Equals [!Ref EnableGuardDutyExport, 'true']
  CreatesLogBucket: !Or
    - !Condition CreatesTrail
    - !Condition ExportsGuardDuty
  ManagesAlbLogs: !Equals [!Ref EnableAlbAccessLogs, 'true']
  ReadsCreatedBuckets: !Or
    - !Condition CreatesLogBucket
    - !Condition ManagesAlbLogs

Resources:
  # --- Papel de leitura ---

  # Leitura mínima. Também é o limite de permissões (PermissionsBoundary) do papel: uma política que alguém anexe
  # depois não passa do que está aqui.
  ReaderPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: VeraxControlReader
      Path: /verax/
      Description: Verax Control - descoberta das fontes, configuração (Ativos e Postura) e a leitura autorizada.
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          # --- Descoberta e postura (sempre) ---
          # Nenhuma declaração deste grupo lê conteúdo: nem evento de log, nem achado, nem objeto, nem dado de banco.

          # O papel lê as próprias etiquetas e simula as próprias permissões (para avisar se tiver permissão demais).
          # Só este papel.
          - Sid: AutoInspecao
            Effect: Allow
            Action: [iam:GetRole, iam:SimulatePrincipalPolicy]
            Resource: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/verax/verax-control-reader'
          # Confere se a trilha e o export do GuardDuty estão ligados e para onde gravam. Não lê evento nem achado.
          - Sid: ValidarFontes
            Effect: Allow
            Resource: '*'
            Action:
              - cloudtrail:DescribeTrails
              - cloudtrail:GetTrailStatus
              - guardduty:ListDetectors
              - guardduty:GetDetector
              - guardduty:ListPublishingDestinations
              - guardduty:DescribePublishingDestination
          # Ativos e Postura: IAM, EC2 e a exposição dos buckets. Sem SecurityAudit nem GenerateCredentialReport (que
          # cria o relatório na conta). Das chaves de acesso, só idade e último uso, nunca o segredo.
          - Sid: PosturaEAtivos
            Effect: Allow
            Resource: '*'
            Action:
              - iam:GetAccountSummary
              - iam:GetAccountPasswordPolicy
              - iam:ListUsers
              - iam:ListAccessKeys
              - iam:GetAccessKeyLastUsed
              - iam:ListMFADevices
              - iam:GetLoginProfile
              - ec2:DescribeRegions
              - ec2:DescribeInstances
              - ec2:DescribeSecurityGroups
              - ec2:GetEbsEncryptionByDefault
              - s3:ListAllMyBuckets
              - s3:GetBucketAcl
              - s3:GetBucketPolicyStatus
              - s3:GetBucketPublicAccessBlock
              - s3:GetAccountPublicAccessBlock
          # Descobre o que a conta já registra, para o painel mostrar as fontes sem ninguém digitar bucket, ARN ou
          # região: flow logs, WAF, trilhas, Security Hub, Inspector, Access Analyzer, Config, balanceadores (e o log de
          # acesso), RDS, grupos do CloudWatch Logs e a região e a cifragem dos buckets. Só Describe, Get e List.
          - Sid: DescobrirFontes
            Effect: Allow
            Resource: '*'
            Action:
              - access-analyzer:ListAnalyzers
              - cloudtrail:GetEventSelectors
              - config:DescribeConfigurationRecorders
              - config:DescribeConfigurationRecorderStatus
              - config:DescribeDeliveryChannels
              - ec2:DescribeFlowLogs
              - ec2:DescribeVpcs
              - elasticloadbalancing:DescribeLoadBalancers
              - elasticloadbalancing:DescribeLoadBalancerAttributes
              - inspector2:BatchGetAccountStatus
              - logs:DescribeLogGroups
              - logs:ListTagsForResource
              - rds:DescribeDBInstances
              - rds:DescribeDBClusters
              - s3:GetBucketLocation
              - s3:GetEncryptionConfiguration
              - securityhub:DescribeHub
              - wafv2:GetLoggingConfiguration
              - wafv2:ListLoggingConfigurations
              - wafv2:ListWebACLs

          # --- Logs que a AWS grava no S3 para esta conta (ReadAwsServiceLogs) ---

          # Lê, em qualquer bucket, só os objetos em AWSLogs/<esta conta>/ (e AWSLogs/o-<organização>/<esta conta>/, na
          # trilha de organização), onde a AWS grava os logs dos serviços; nem os de outra conta no mesmo bucket. O * do
          # IAM casa também a /, e os logs da AWS nunca têm o caminho de outra conta mais adiante no nome.
          - !If
            - ReadsServiceLogs
            - Sid: LerLogsDaAwsDestaConta
              Effect: Allow
              Action: s3:GetObject
              Resource:
                - !Sub 'arn:${AWS::Partition}:s3:::*/AWSLogs/${AWS::AccountId}/*'
                - !Sub 'arn:${AWS::Partition}:s3:::*/AWSLogs/o-*/${AWS::AccountId}/*'
            - !Ref AWS::NoValue
          # Lista só os nomes dessas mesmas pastas, também atrás de um prefixo (o log do ALB com prefixo).
          - !If
            - ReadsServiceLogs
            - Sid: ListarLogsDaAwsDestaConta
              Effect: Allow
              Action: s3:ListBucket
              Resource: !Sub 'arn:${AWS::Partition}:s3:::*'
              Condition:
                StringLike:
                  s3:prefix:
                    - !Sub 'AWSLogs/${AWS::AccountId}/*'
                    - !Sub 'AWSLogs/o-*/${AWS::AccountId}/*'
                    - !Sub '*/AWSLogs/${AWS::AccountId}/*'
            - !Ref AWS::NoValue
          # Para achar a pasta AWSLogs, o coletor (Wazuh) lista, com o separador "/", o primeiro nível do bucket e o de
          # AWSLogs/: só nomes, sem abrir outra pasta nem ler conteúdo.
          - !If
            - ReadsServiceLogs
            - Sid: VerPrimeiroNivelDosBuckets
              Effect: Allow
              Action: s3:ListBucket
              Resource: !Sub 'arn:${AWS::Partition}:s3:::*'
              Condition:
                StringEquals:
                  s3:delimiter: /
                  s3:prefix: ['', AWSLogs, AWSLogs/]
            - !Ref AWS::NoValue
          # Decifra só pelo S3 (kms:ViaService): na prática, só os objetos que o papel já lê. A política da chave ainda
          # precisa permitir.
          - !If
            - ReadsServiceLogs
            - Sid: DecifrarLogsDaAwsSoPeloS3
              Effect: Allow
              Action: kms:Decrypt
              Resource: '*'
              Condition:
                StringLike:
                  kms:ViaService: 's3.*.amazonaws.com'
            - !Ref AWS::NoValue

          # --- Achados de segurança (ReadSecurityFindings) ---

          # Lê os achados do GuardDuty, do Security Hub, do Inspector e do Access Analyzer. Não ativa serviço nem
          # arquiva, altera, apaga ou envia achado.
          - !If
            - ReadsFindings
            - Sid: LerAchadosDeSeguranca
              Effect: Allow
              Resource: '*'
              Action:
                - access-analyzer:GetFinding
                - access-analyzer:ListFindings
                - guardduty:GetFindings
                - guardduty:ListFindings
                - inspector2:ListCoverage
                - inspector2:ListFindings
                - securityhub:GetEnabledStandards
                - securityhub:GetFindings
            - !Ref AWS::NoValue

          # --- Grupos do CloudWatch Logs etiquetados (ReadTaggedLogGroups) ---

          # Lê os eventos só dos grupos de log com a etiqueta verax-control = leitura, que você põe e tira. Sem ela, só
          # o nome e as etiquetas, pela descoberta; o papel não etiqueta nada. As duas formas do ARN: o grupo e os streams.
          - !If
            - ReadsLogGroups
            - Sid: LerGruposDeLogEtiquetados
              Effect: Allow
              Action: [logs:DescribeLogStreams, logs:FilterLogEvents, logs:GetLogEvents]
              Resource:
                - !Sub 'arn:${AWS::Partition}:logs:*:${AWS::AccountId}:log-group:*'
                - !Sub 'arn:${AWS::Partition}:logs:*:${AWS::AccountId}:log-group:*:*'
              Condition:
                StringEquals:
                  aws:ResourceTag/verax-control: leitura
            - !Ref AWS::NoValue

          # --- Buckets adicionais, fora do padrão AWSLogs (LogBucketArns) ---

          # Os buckets e as chaves que o cliente informou, já existentes: o Wazuh do nó lista e lê os objetos deles
          # inteiros (GetBucketLocation foi conferido no módulo aws-s3 do Wazuh 4.14.9). Nenhum outro bucket.
          - !If
            - HasLogBuckets
            - Sid: ListarBucketsDeLog
              Effect: Allow
              Action: [s3:ListBucket, s3:GetBucketLocation]
              Resource: !Ref LogBucketArns
            - !Ref AWS::NoValue
          - !If
            - HasLogBuckets
            # Os objetos de cada bucket: <arn>/* para cada ARN da lista. Os prefixos opcionais ficam na negação.
            - Sid: LerObjetosDeLog
              Effect: Allow
              Action: s3:GetObject
              Resource: !Split [',', !Join ['', [!Join ['/*,', !Ref LogBucketArns], '/*']]]
            - !Ref AWS::NoValue
          # As chaves dos buckets adicionais, só pelo S3. Fica de fora quando a leitura dos logs da AWS está
          # autorizada: a declaração DecifrarLogsDaAwsSoPeloS3 já cobre a chave de todo objeto que o papel lê.
          - !If
            - DecryptsLogBuckets
            - Sid: DecifrarSoPeloS3
              Effect: Allow
              Action: kms:Decrypt
              Resource: !Ref LogKmsKeyArns
              Condition:
                StringLike:
                  kms:ViaService: 's3.*.amazonaws.com'
            - !Ref AWS::NoValue

          # --- Criados por esta pilha (CreateTrail e EnableGuardDutyExport) ---

          # Os buckets e a chave criados por esta pilha, se o cliente pediu a trilha, o export ou o log dos ALB.
          - !If
            - ReadsCreatedBuckets
            - Sid: ListarBucketsCriados
              Effect: Allow
              Action: [s3:ListBucket, s3:GetBucketLocation]
              Resource:
                - !If [CreatesTrail, !GetAtt TrailBucket.Arn, !Ref AWS::NoValue]
                - !If [ExportsGuardDuty, !GetAtt GuardDutyBucket.Arn, !Ref AWS::NoValue]
                - !If [ManagesAlbLogs, !GetAtt AlbLogsBucket.Arn, !Ref AWS::NoValue]
            - !Ref AWS::NoValue
          - !If
            - ReadsCreatedBuckets
            - Sid: LerObjetosCriados
              Effect: Allow
              Action: s3:GetObject
              Resource:
                - !If [CreatesTrail, !Sub '${TrailBucket.Arn}/*', !Ref AWS::NoValue]
                - !If [ExportsGuardDuty, !Sub '${GuardDutyBucket.Arn}/*', !Ref AWS::NoValue]
                - !If [ManagesAlbLogs, !Sub '${AlbLogsBucket.Arn}/*', !Ref AWS::NoValue]
            - !Ref AWS::NoValue
          - !If
            - CreatesLogBucket
            - Sid: DecifrarCriadosSoPeloS3
              Effect: Allow
              Action: kms:Decrypt
              Resource: !GetAtt LogsKey.Arn
              Condition:
                StringEquals:
                  kms:ViaService: !Sub 's3.${AWS::Region}.amazonaws.com'
            - !Ref AWS::NoValue
          # Só com EnableAlbAccessLogs: os atributos de um ALB desta região (o IAM não filtra a chave do atributo). O nó
          # só manda as do log de acesso (access_logs.s3.*), com o bucket desta pilha, quando alguém pede no painel.
          - !If
            - ManagesAlbLogs
            - Sid: LigarLogDosAlb
              Effect: Allow
              Action: elasticloadbalancing:ModifyLoadBalancerAttributes
              Resource: !Sub 'arn:${AWS::Partition}:elasticloadbalancing:${AWS::Region}:${AWS::AccountId}:loadbalancer/app/*'
            - !Ref AWS::NoValue

  # Negações explícitas: valem mesmo que alguém anexe outra política ao papel.
  GuardrailsPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: VeraxControlGuardrails
      Path: /verax/
      Description: Verax Control - nega chamadas de fora do IP do nó, alteração de logs e ampliação do próprio acesso.
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          # Toda chamada direta (aws:ViaAWSService falso) de fora do IP do nó é negada, mesmo com a sessão vazada. Fica de
          # fora só a de um serviço pelo papel (o S3 pedindo ao KMS o objeto lido), que a negação por IP barraria.
          - Sid: SoDoNoDaVerax
            Effect: Deny
            Action: '*'
            Resource: '*'
            Condition:
              NotIpAddress:
                aws:SourceIp: !Split [',', !Ref NodeEgressIps]
              Bool:
                aws:ViaAWSService: 'false'
          # Ações que poderiam apagar, desligar ou desviar logs e findings (a mesma lista do conector).
          - Sid: NuncaAlterarLogs
            Effect: Deny
            Resource: '*'
            Action:
              - access-analyzer:Delete*
              - access-analyzer:Update*
              - cloudtrail:Create*
              - cloudtrail:Delete*
              - cloudtrail:Put*
              - cloudtrail:Stop*
              - cloudtrail:Update*
              - guardduty:Archive*
              - guardduty:Create*
              - guardduty:Delete*
              - guardduty:Disable*
              - guardduty:Disassociate*
              - guardduty:Update*
              - inspector2:Delete*
              - inspector2:Disable*
              - inspector2:Update*
              - kms:Delete*
              - kms:Disable*
              - kms:Put*
              - kms:ScheduleKeyDeletion
              - kms:Update*
              - logs:Associate*
              - logs:Create*
              - logs:Delete*
              - logs:Disassociate*
              - logs:Put*
              - logs:Tag*
              - logs:Unmask
              - logs:Untag*
              - logs:Update*
              - s3:Abort*
              - s3:Bypass*
              - s3:Create*
              - s3:Delete*
              - s3:Put*
              - s3:Replicate*
              - s3:Restore*
              - s3:Update*
              - securityhub:BatchImport*
              - securityhub:BatchUpdate*
              - securityhub:Delete*
              - securityhub:Disable*
              - securityhub:Update*
              - wafv2:Delete*
              - wafv2:Put*
              - wafv2:Update*
          # As outras fontes da descoberta e os serviços de achados: nada de ligar, desligar, criar ou alterar (a lista
          # acima é a do conector; esta, a que o papel de leitura soma).
          - Sid: NuncaAlterarOutrasFontes
            Effect: Deny
            Resource: '*'
            Action:
              - access-analyzer:Apply*
              - access-analyzer:Cancel*
              - access-analyzer:Create*
              - access-analyzer:Start*
              - access-analyzer:Tag*
              - access-analyzer:Untag*
              - config:Delete*
              - config:Put*
              - config:Start*
              - config:Stop*
              - ec2:CreateFlowLogs
              - ec2:DeleteFlowLogs
              - !If [ManagesAlbLogs, !Ref AWS::NoValue, 'elasticloadbalancing:Modify*']
              - inspector2:Associate*
              - inspector2:BatchUpdate*
              - inspector2:Cancel*
              - inspector2:Create*
              - inspector2:Disassociate*
              - inspector2:Enable*
              - inspector2:Reset*
              - inspector2:Send*
              - inspector2:Start*
              - inspector2:Stop*
              - inspector2:Tag*
              - inspector2:Untag*
              - securityhub:Accept*
              - securityhub:BatchDelete*
              - securityhub:BatchDisable*
              - securityhub:BatchEnable*
              - securityhub:Create*
              - securityhub:Decline*
              - securityhub:Disassociate*
              - securityhub:Enable*
              - securityhub:Invite*
              - securityhub:Start*
              - securityhub:Tag*
              - securityhub:Untag*
              - wafv2:Associate*
              - wafv2:Create*
              - wafv2:Disassociate*
              - wafv2:Tag*
              - wafv2:Untag*
          # Com EnableAlbAccessLogs, só o ModifyLoadBalancerAttributes de um ALB desta região sai da negação acima.
          - !If
            - ManagesAlbLogs
            - Sid: NuncaAlterarBalanceadoresAlemDoLog
              Effect: Deny
              Action: elasticloadbalancing:Modify*
              NotResource: !Sub 'arn:${AWS::Partition}:elasticloadbalancing:${AWS::Region}:${AWS::AccountId}:loadbalancer/app/*'
            - !Ref AWS::NoValue
          - !If
            - ManagesAlbLogs
            - Sid: NuncaAlterarOAlbAlemDosAtributos
              Effect: Deny
              Action: [elasticloadbalancing:ModifyCapacityReservation, elasticloadbalancing:ModifyIpPools]
              Resource: '*'
            - !Ref AWS::NoValue
          # As etiquetas do papel dizem ao painel a versão deste modelo e o que foi autorizado: o papel não as troca,
          # nem etiqueta nada no IAM. (Etiquetar um grupo de log para ganhar leitura já é negado acima, em logs:Tag*.)
          - Sid: NuncaTrocarAsPropriasEtiquetas
            Effect: Deny
            Resource: '*'
            Action: [iam:Tag*, iam:Untag*]
          # Nem o próprio papel: sem criar, trocar ou apagar chaves, usuários, políticas ou papéis (nem a confiança e o
          # limite dele), sem passar papel a um serviço e sem assumir outro papel.
          - Sid: NuncaAmpliarOProprioAcesso
            Effect: Deny
            Resource: '*'
            Action:
              - iam:Add*
              - iam:Attach*
              - iam:Create*
              - iam:Delete*
              - iam:Detach*
              - iam:PassRole
              - iam:Put*
              - iam:Remove*
              - iam:Set*
              - iam:Update*
              - iam:Upload*
              - sts:AssumeRole
              - sts:AssumeRoleWithSAML
              - sts:AssumeRoleWithWebIdentity
              - sts:GetFederationToken
          # Com os prefixos, só os objetos que começam com um deles, em qualquer bucket (o IAM não cruza as listas). Os
          # buckets desta pilha e, com os logs da AWS, AWSLogs/<esta conta>/ ficam fora: só os adicionais estreitam.
          - !If
            - HasObjectPrefix
            - Sid: SoOsPrefixosInformados
              Effect: Deny
              Action: s3:GetObject
              NotResource: !Split
                - ','
                - !Join
                  - ''
                  - - 'arn:*:s3:::*/'
                    - !Join ['*,arn:*:s3:::*/', !Ref LogObjectPrefix]
                    - '*'
                    - !If [CreatesTrail, !Sub ',${TrailBucket.Arn}/*', '']
                    - !If [ExportsGuardDuty, !Sub ',${GuardDutyBucket.Arn}/*', '']
                    - !If [ManagesAlbLogs, !Sub ',${AlbLogsBucket.Arn}/*', '']
                    - !If
                      - ReadsServiceLogs
                      - !Sub ',arn:${AWS::Partition}:s3:::*/AWSLogs/${AWS::AccountId}/*'
                      - ''
                    - !If
                      - ReadsServiceLogs
                      - !Sub ',arn:${AWS::Partition}:s3:::*/AWSLogs/o-*/${AWS::AccountId}/*'
                      - ''
            - !Ref AWS::NoValue

  # O papel que o nó assume, sem chave: troca no STS um token do Google (até 1 hora) por uma sessão de até 1 hora. Nome e
  # caminho fixos (CAPABILITY_NAMED_IAM): o ARN sai só do ID da conta.
  ReaderRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: verax-control-reader
      Path: /verax/
      Description: Verax Control - leitura dos logs e da configuração, só pelo nó do Verax Control, sem chave.
      MaxSessionDuration: 3600
      PermissionsBoundary: !Ref ReaderPolicy
      ManagedPolicyArns:
        - !Ref ReaderPolicy
        - !Ref GuardrailsPolicy
      # O que o nó lê do próprio papel (iam:GetRole): a versão deste modelo e o que foi autorizado. Não dão permissão;
      # sem elas, é o modelo 1. Separadas por espaço: o IAM não aceita vírgula no valor.
      Tags:
        - Key: verax-control:template
          Value: '3'
        - Key: verax-control:capabilities
          Value: !Join
            - ''
            - - discovery
              - !If [ReadsServiceLogs, ' service-logs', '']
              - !If [ReadsFindings, ' findings', '']
              - !If [ReadsLogGroups, ' log-groups', '']
        # Com EnableAlbAccessLogs: <região>/<bucket> do log dos ALB, para onde o painel liga o log.
        - !If
          - ManagesAlbLogs
          - Key: verax-control:alb-logs-bucket
            Value: !Sub '${AWS::Region}/${AlbLogsBucket}'
          - !Ref AWS::NoValue
      # Escrita à mão: o assistente "Web identity / Google" do console grava o audience em accounts.google.com:aud, que
      # num token de conta de serviço é o azp (o ID dela), e nunca aceitaria o nó. Não há provedor OIDC a criar.
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: SoONoDaVerax
            Effect: Allow
            Principal:
              Federated: accounts.google.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                # O campo azp do token, que numa conta de serviço é o ID único dela.
                accounts.google.com:aud: !Ref NodeServiceAccountId
                # O identificador estável da conta de serviço: recriada com o mesmo e-mail, ela ganha outro ID. Cada
                # cliente tem o nó e a conta de serviço dele, e o sub de um não entra no papel de outro.
                accounts.google.com:sub: !Ref NodeServiceAccountId
                # O audience que o nó pede ao Google: um token emitido para outro destino não serve aqui.
                accounts.google.com:oaud: !Ref Audience
              # Só a partir do IP de saída do nó: um token vazado não entra de outro lugar.
              IpAddress:
                aws:SourceIp: !Split [',', !Ref NodeEgressIps]

  # --- Opcional: trilha e export do GuardDuty (do conector T4.3) ---

  LogsKey:
    Type: AWS::KMS::Key
    Condition: CreatesLogBucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: Verax Control - cifra a trilha do CloudTrail e o export do GuardDuty criados pela pilha
      EnableKeyRotation: true
      PendingWindowInDays: 30
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: AdministracaoPelaConta
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:root'
            Action: kms:*
            Resource: '*'
          - Sid: CloudTrailCifra
            Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action: kms:GenerateDataKey*
            Resource: '*'
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              StringLike:
                kms:EncryptionContext:aws:cloudtrail:arn: !Sub 'arn:${AWS::Partition}:cloudtrail:*:${AWS::AccountId}:trail/*'
          - Sid: CloudTrailDescreveChave
            Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action: kms:DescribeKey
            Resource: '*'
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
          - Sid: GuardDutyCifra
            Effect: Allow
            Principal:
              Service: guardduty.amazonaws.com
            Action: kms:GenerateDataKey
            Resource: '*'
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnLike:
                aws:SourceArn: !Sub 'arn:${AWS::Partition}:guardduty:*:${AWS::AccountId}:detector/*'

  LogsKeyAlias:
    Type: AWS::KMS::Alias
    Condition: CreatesLogBucket
    Properties:
      AliasName: alias/verax-control-logs
      TargetKeyId: !Ref LogsKey

  # Log de acesso dos buckets de log (CIS). Os buckets desta pilha não têm BucketName: ficam na conta (Retain), e um
  # nome fixo faria a criação seguinte falhar. As saídas da pilha mostram o nome gerado.
  AccessLogsBucket:
    Type: AWS::S3::Bucket
    Condition: CreatesLogBucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_18
            comment: É o próprio destino dos logs de acesso; registrar o acesso a ele criaria um ciclo.
    Properties:
      # O log de acesso do S3 só é entregue em bucket com SSE-S3 (não aceita SSE-KMS).
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: retencao
            Status: Enabled
            ExpirationInDays: !Ref LogRetentionDays
            NoncurrentVersionExpiration:
              NoncurrentDays: 30
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7

  AccessLogsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Condition: CreatesLogBucket
    Properties:
      Bucket: !Ref AccessLogsBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: SomenteTLS
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource: [!GetAtt AccessLogsBucket.Arn, !Sub '${AccessLogsBucket.Arn}/*']
            Condition:
              Bool:
                aws:SecureTransport: 'false'
          - Sid: LogDeAcessoDosBucketsDaPilha
            Effect: Allow
            Principal:
              Service: logging.s3.amazonaws.com
            Action: s3:PutObject
            Resource: !Sub '${AccessLogsBucket.Arn}/*'
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              # Só os buckets desta pilha, pelo ARN exato. A ordem é a do exemplo da AWS para o log de acesso: o bucket
              # de origem nasce com o log configurado, e esta política vem depois.
              ArnEquals:
                aws:SourceArn:
                  - !If [CreatesTrail, !GetAtt TrailBucket.Arn, !Ref AWS::NoValue]
                  - !If [ExportsGuardDuty, !GetAtt GuardDutyBucket.Arn, !Ref AWS::NoValue]

  TrailBucket:
    Type: AWS::S3::Bucket
    Condition: CreatesTrail
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LoggingConfiguration:
        DestinationBucketName: !Ref AccessLogsBucket
        LogFilePrefix: cloudtrail/
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - BucketKeyEnabled: true
            ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
              KMSMasterKeyID: !GetAtt LogsKey.Arn
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: retencao
            Status: Enabled
            ExpirationInDays: !Ref LogRetentionDays
            NoncurrentVersionExpiration:
              NoncurrentDays: 30
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7

  TrailBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Condition: CreatesTrail
    Properties:
      Bucket: !Ref TrailBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: SomenteTLS
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource: [!GetAtt TrailBucket.Arn, !Sub '${TrailBucket.Arn}/*']
            Condition:
              Bool:
                aws:SecureTransport: 'false'
          - Sid: CloudTrailConfereAcl
            Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action: s3:GetBucketAcl
            Resource: !GetAtt TrailBucket.Arn
            Condition:
              StringEquals:
                aws:SourceArn: !Sub 'arn:${AWS::Partition}:cloudtrail:${AWS::Region}:${AWS::AccountId}:trail/verax-control'
          - Sid: CloudTrailGrava
            Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action: s3:PutObject
            Resource: !Sub '${TrailBucket.Arn}/AWSLogs/${AWS::AccountId}/*'
            Condition:
              StringEquals:
                s3:x-amz-acl: bucket-owner-full-control
                aws:SourceArn: !Sub 'arn:${AWS::Partition}:cloudtrail:${AWS::Region}:${AWS::AccountId}:trail/verax-control'

  # Falso positivo do Trivy (AWS-0015): o adaptador dele lê `KmsKeyId`, mas o esquema do CloudFormation exige
  # `KMSKeyId`, que está definido abaixo com a chave da pilha (conferido em tests/test_reader.py).
  # trivy:ignore:AWS-0015
  Trail:
    Type: AWS::CloudTrail::Trail
    Condition: CreatesTrail
    DependsOn: TrailBucketPolicy
    Properties:
      TrailName: verax-control
      S3BucketName: !Ref TrailBucket
      KMSKeyId: !GetAtt LogsKey.Arn
      IsLogging: true
      IsMultiRegionTrail: true
      IncludeGlobalServiceEvents: true
      EnableLogFileValidation: true

  GuardDutyBucket:
    Type: AWS::S3::Bucket
    Condition: ExportsGuardDuty
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LoggingConfiguration:
        DestinationBucketName: !Ref AccessLogsBucket
        LogFilePrefix: guardduty/
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - BucketKeyEnabled: true
            ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
              KMSMasterKeyID: !GetAtt LogsKey.Arn
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: retencao
            Status: Enabled
            ExpirationInDays: !Ref LogRetentionDays
            NoncurrentVersionExpiration:
              NoncurrentDays: 30
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7

  GuardDutyBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Condition: ExportsGuardDuty
    Properties:
      Bucket: !Ref GuardDutyBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: SomenteTLS
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource: [!GetAtt GuardDutyBucket.Arn, !Sub '${GuardDutyBucket.Arn}/*']
            Condition:
              Bool:
                aws:SecureTransport: 'false'
          - Sid: GuardDutyLocalizaBucket
            Effect: Allow
            Principal:
              Service: guardduty.amazonaws.com
            Action: s3:GetBucketLocation
            Resource: !GetAtt GuardDutyBucket.Arn
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnLike:
                aws:SourceArn: !Sub 'arn:${AWS::Partition}:guardduty:*:${AWS::AccountId}:detector/*'
          - Sid: GuardDutyGrava
            Effect: Allow
            Principal:
              Service: guardduty.amazonaws.com
            Action: s3:PutObject
            Resource: !Sub '${GuardDutyBucket.Arn}/*'
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnLike:
                aws:SourceArn: !Sub 'arn:${AWS::Partition}:guardduty:*:${AWS::AccountId}:detector/*'
          - Sid: GuardDutySoComAChaveDaPilha
            Effect: Deny
            Principal:
              Service: guardduty.amazonaws.com
            Action: s3:PutObject
            Resource: !Sub '${GuardDutyBucket.Arn}/*'
            Condition:
              StringNotEquals:
                s3:x-amz-server-side-encryption-aws-kms-key-id: !GetAtt LogsKey.Arn

  # Só o destino do detector que já existe: a pilha não ativa nem altera o GuardDuty.
  GuardDutyExport:
    Type: AWS::GuardDuty::PublishingDestination
    Condition: ExportsGuardDuty
    DependsOn: GuardDutyBucketPolicy
    Metadata:
      cfn-lint:
        config:
          # Falso positivo: o cfn-lint resolve o Ref pelo padrão vazio, mas com o export ligado a regra
          # ExportPrecisaDoDetector recusa o ID vazio antes de criar qualquer recurso.
          ignore_checks: [W1030]
    Properties:
      DetectorId: !Ref GuardDutyDetectorId
      DestinationType: S3
      DestinationProperties:
        DestinationArn: !GetAtt GuardDutyBucket.Arn
        KmsKeyArn: !GetAtt LogsKey.Arn

  # Só com EnableAlbAccessLogs: o destino do log dos ALB desta região (o ALB só grava em bucket da região dele, e com
  # SSE-S3: não aceita chave do KMS). Bucket e política ficam (Retain) se a opção for desligada: nenhum ALB perde o log.
  # Trivy AWS-0132 (chave do KMS) não se aplica: o ALB só entrega o log com SSE-S3.
  # trivy:ignore:AWS-0132
  AlbLogsBucket:
    Type: AWS::S3::Bucket
    Condition: ManagesAlbLogs
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_18
            comment: É um bucket de log; a leitura pelo papel fica no CloudTrail.
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration: [{ ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 } }]
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls: { Rules: [{ ObjectOwnership: BucketOwnerEnforced }] }
      VersioningConfiguration: { Status: Enabled }
      LifecycleConfiguration:
        Rules:
          - Id: retencao
            Status: Enabled
            ExpirationInDays: !Ref LogRetentionDays
            NoncurrentVersionExpiration: { NoncurrentDays: 30 }
            AbortIncompleteMultipartUpload: { DaysAfterInitiation: 7 }

  AlbLogsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Condition: ManagesAlbLogs
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Bucket: !Ref AlbLogsBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: SomenteTLS
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource: [!GetAtt AlbLogsBucket.Arn, !Sub '${AlbLogsBucket.Arn}/*']
            Condition:
              Bool:
                aws:SecureTransport: 'false'
          # A política atual da AWS, que vale em toda região (a antiga, com a conta do ELB, só nas de antes de 08/2022).
          - Sid: EntregaDoLogDosAlb
            Effect: Allow
            Principal:
              Service: logdelivery.elasticloadbalancing.amazonaws.com
            Action: s3:PutObject
            Resource: !Sub '${AlbLogsBucket.Arn}/AWSLogs/${AWS::AccountId}/*'
            Condition:
              ArnLike:
                aws:SourceArn: !Sub 'arn:${AWS::Partition}:elasticloadbalancing:${AWS::Region}:${AWS::AccountId}:loadbalancer/*'

Outputs:
  RoleArn:
    Description: >-
      ARN do papel de leitura, sempre arn:aws:iam::<conta>:role/verax/verax-control-reader: o painel o deriva do ID da
      conta e confere a conexão sozinho. Não há chave nem segredo a copiar.
    Value: !GetAtt ReaderRole.Arn
  TrailBucketArn:
    Condition: CreatesTrail
    Description: Bucket da trilha criada pela pilha (cadastre no painel).
    Value: !GetAtt TrailBucket.Arn
  GuardDutyBucketArn:
    Condition: ExportsGuardDuty
    Description: Bucket do export do GuardDuty criado pela pilha (cadastre no painel).
    Value: !GetAtt GuardDutyBucket.Arn
  LogsKeyArn:
    Condition: CreatesLogBucket
    Description: Chave KMS que cifra os buckets criados pela pilha.
    Value: !GetAtt LogsKey.Arn
  AccessLogsBucketArn:
    Condition: CreatesLogBucket
    Description: Bucket com o log de acesso dos buckets criados pela pilha (o papel não o lê).
    Value: !GetAtt AccessLogsBucket.Arn
  AlbLogsBucketName:
    Condition: ManagesAlbLogs
    Description: Bucket do log de acesso dos ALB desta região, que o painel liga a seu pedido.
    Value: !Ref AlbLogsBucket
