# Casos do `cfn-guard test` para as regras de verax-control-reader.guard: um modelo que passa e uma mutação por regra
# (as do plano: sem o Deny de IP, com uma chave, com GetObject em qualquer recurso e sem o limite de permissões).
- name: modelo (o mínimo do template, como o cfn-guard o lê)
  input:
    Resources:
      ReaderPolicy:
        Type: AWS::IAM::ManagedPolicy
        Properties:
          ManagedPolicyName: VeraxControlReader
          PolicyDocument:
            Statement:
              - Fn::If:
                  - HasLogBuckets
                  - Sid: LerObjetosDeLog
                    Effect: Allow
                    Action: s3:GetObject
                    Resource: { Ref: LogBucketArns }
                  - { Ref: AWS::NoValue }
              - Fn::If:
                  - DecryptsLogBuckets
                  - Sid: DecifrarSoPeloS3
                    Effect: Allow
                    Action: kms:Decrypt
                    Resource: { Ref: LogKmsKeyArns }
                    Condition: { StringLike: { kms:ViaService: s3.*.amazonaws.com } }
                  - { Ref: AWS::NoValue }
              - Sid: AutoInspecao
                Effect: Allow
                Action: iam:SimulatePrincipalPolicy
                Resource:
                  Fn::Sub: 'arn:${AWS::Partition}:iam::${AWS::AccountId}:user/verax/verax-control-reader'
              - Sid: PosturaEAtivos
                Effect: Allow
                Resource: '*'
                Action: [iam:ListUsers, ec2:DescribeInstances]
      GuardrailsPolicy:
        Type: AWS::IAM::ManagedPolicy
        Properties:
          ManagedPolicyName: VeraxControlGuardrails
          PolicyDocument:
            Statement:
              - Sid: SoDoNoDaVerax
                Effect: Deny
                Action: '*'
                Resource: '*'
                Condition: { NotIpAddress: { aws:SourceIp: { Ref: NodeEgressIps } } }
      ReaderUser:
        Type: AWS::IAM::User
        Properties:
          UserName: verax-control-reader
          Path: /verax/
          PermissionsBoundary: { Ref: ReaderPolicy }
          Groups: [{ Ref: ReadersGroup }]
    Outputs:
      UserArn: { Value: { Fn::GetAtt: ReaderUser.Arn } }
  expectations:
    rules:
      sem_chave_de_acesso: PASS
      nenhuma_saida_com_segredo: PASS
      usuario_sem_senha_e_com_limite: PASS
      nega_fora_do_ip_do_no: PASS
      leitura_so_le: PASS
      conteudo_so_nos_recursos_informados: PASS
      waf_e_guardduty_intocados: PASS

- name: com uma chave de acesso e o segredo numa saída
  input:
    Resources:
      Chave: { Type: AWS::IAM::AccessKey, Properties: { UserName: { Ref: ReaderUser } } }
    Outputs:
      Segredo: { Value: { Fn::GetAtt: [Chave, SecretAccessKey] } }
      SegredoCurto: { Value: { Fn::GetAtt: Chave.SecretAccessKey } }
  expectations:
    rules:
      sem_chave_de_acesso: FAIL
      nenhuma_saida_com_segredo: FAIL

- name: sem o Deny de fora do IP do nó
  input:
    Resources:
      GuardrailsPolicy:
        Type: AWS::IAM::ManagedPolicy
        Properties:
          ManagedPolicyName: VeraxControlGuardrails
          PolicyDocument:
            Statement:
              - { Sid: NuncaAlterarLogs, Effect: Deny, Action: ['s3:Delete*'], Resource: '*' }
  expectations:
    rules:
      nega_fora_do_ip_do_no: FAIL

- name: Deny de IP com outra condição (o IP vira opcional)
  input:
    Resources:
      GuardrailsPolicy:
        Type: AWS::IAM::ManagedPolicy
        Properties:
          ManagedPolicyName: VeraxControlGuardrails
          PolicyDocument:
            Statement:
              - Sid: SoDoNoDaVerax
                Effect: Deny
                Action: '*'
                Resource: '*'
                Condition: { NotIpAddress: { aws:SourceIp: ['0.0.0.0/0'] } }
  expectations:
    rules:
      nega_fora_do_ip_do_no: FAIL

- name: sem o limite de permissões
  input:
    Resources:
      ReaderUser:
        Type: AWS::IAM::User
        Properties: { UserName: verax-control-reader, Path: /verax/, Groups: [{ Ref: ReadersGroup }] }
  expectations:
    rules:
      usuario_sem_senha_e_com_limite: FAIL

- name: com senha de console
  input:
    Resources:
      ReaderUser:
        Type: AWS::IAM::User
        Properties:
          UserName: verax-control-reader
          Path: /verax/
          PermissionsBoundary: { Ref: ReaderPolicy }
          Groups: [{ Ref: ReadersGroup }]
          LoginProfile: { Password: { Ref: SenhaInicial } }
  expectations:
    rules:
      usuario_sem_senha_e_com_limite: FAIL

- name: GetObject em qualquer recurso
  input:
    Resources:
      ReaderPolicy:
        Type: AWS::IAM::ManagedPolicy
        Properties:
          ManagedPolicyName: VeraxControlReader
          PolicyDocument:
            Statement:
              - Fn::If:
                  - HasLogBuckets
                  - { Sid: LerObjetosDeLog, Effect: Allow, Action: s3:GetObject, Resource: '*' }
                  - { Ref: AWS::NoValue }
  expectations:
    rules:
      leitura_so_le: PASS
      conteudo_so_nos_recursos_informados: FAIL

- name: GetObject em todos os buckets por curinga
  input:
    Resources:
      ReaderPolicy:
        Type: AWS::IAM::ManagedPolicy
        Properties:
          ManagedPolicyName: VeraxControlReader
          PolicyDocument:
            Statement:
              - Fn::If:
                  - HasLogBuckets
                  - Sid: LerObjetosDeLog
                    Effect: Allow
                    Action: s3:GetObject
                    Resource: 'arn:aws:s3:::*/*'
                  - { Ref: AWS::NoValue }
  expectations:
    rules:
      conteudo_so_nos_recursos_informados: FAIL

- name: GetObject numa declaração que não depende das fontes informadas
  input:
    Resources:
      ReaderPolicy:
        Type: AWS::IAM::ManagedPolicy
        Properties:
          ManagedPolicyName: VeraxControlReader
          PolicyDocument:
            Statement:
              - { Sid: PosturaEAtivos, Effect: Allow, Resource: '*', Action: [iam:ListUsers, s3:GetObject] }
  expectations:
    rules:
      conteudo_so_nos_recursos_informados: FAIL

- name: Decrypt fora do S3
  input:
    Resources:
      ReaderPolicy:
        Type: AWS::IAM::ManagedPolicy
        Properties:
          ManagedPolicyName: VeraxControlReader
          PolicyDocument:
            Statement:
              - Fn::If:
                  - DecryptsLogBuckets
                  - Sid: DecifrarSoPeloS3
                    Effect: Allow
                    Action: kms:Decrypt
                    Resource: { Ref: LogKmsKeyArns }
                  - { Ref: AWS::NoValue }
  expectations:
    rules:
      conteudo_so_nos_recursos_informados: FAIL

- name: escrita liberada
  input:
    Resources:
      ReaderPolicy:
        Type: AWS::IAM::ManagedPolicy
        Properties:
          ManagedPolicyName: VeraxControlReader
          PolicyDocument:
            Statement:
              - Sid: PosturaEAtivos
                Effect: Allow
                Resource: '*'
                Action: [iam:ListUsers, iam:CreateAccessKey]
  expectations:
    rules:
      leitura_so_le: FAIL

- name: escrita liberada numa declaração condicional
  input:
    Resources:
      ReaderPolicy:
        Type: AWS::IAM::ManagedPolicy
        Properties:
          ManagedPolicyName: VeraxControlReader
          PolicyDocument:
            Statement:
              - Fn::If:
                  - HasLogBuckets
                  - Sid: LerObjetosDeLog
                    Effect: Allow
                    Action: [s3:GetObject, s3:PutObject]
                    Resource: { Ref: X }
                  - { Ref: AWS::NoValue }
  expectations:
    rules:
      leitura_so_le: FAIL

- name: log do WAF alterado e GuardDuty ativado pela pilha
  input:
    Resources:
      Log: { Type: AWS::WAFv2::LoggingConfiguration, Properties: { ResourceArn: x } }
      Detector: { Type: AWS::GuardDuty::Detector, Properties: { Enable: true } }
  expectations:
    rules:
      waf_e_guardduty_intocados: FAIL
