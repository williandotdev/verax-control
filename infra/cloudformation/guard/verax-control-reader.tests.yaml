# Casos do `cfn-guard test` para as regras de verax-control-reader.guard: um modelo que passa e mutações por regra (um
# usuário, uma chave ou um segredo na pilha; cada condição da confiança tirada, afrouxada ou trocada; outro principal
# ou outra ação; o papel sem o limite ou com sessão, nome ou política a mais; sem o Deny de IP; GetObject em qualquer
# recurso) e as formas que uma regra frouxa deixaria passar (GetAtt em lista ou em texto, ação ou recurso em lista,
# curinga no StringLike ou no StringEquals, uma chave ou um operador a mais). Do modelo 2: a exceção do Deny de IP para o
# serviço que age em nome do papel, tirada, invertida ou trocada; cada autorização do cliente fora do interruptor dela;
# cada declaração de uma autorização afrouxada (o bucket inteiro, a pasta de outra conta, a listagem sem o separador, o
# Decrypt sem o S3, um grupo de log sem a etiqueta, uma escrita entre os achados); e as etiquetas do papel trocadas.
- name: modelo (o mínimo do template, como o cfn-guard o lê)
  input:
    Parameters:
      NodeServiceAccountId: { Type: String, AllowedPattern: '^[0-9]{21}$' }
      NodeEgressIps: { Type: String }
      Audience: { Type: String, Default: 'https://control.veraxsistemas.com.br/aws-reader' }
      ReadAwsServiceLogs: { Type: String, AllowedValues: ['true', 'false'], Default: 'true' }
      ReadSecurityFindings: { Type: String, AllowedValues: ['true', 'false'], Default: 'true' }
      ReadTaggedLogGroups: { Type: String, AllowedValues: ['true', 'false'], Default: 'true' }
      EnableAlbAccessLogs: { Type: String, AllowedValues: ['true', 'false'], Default: 'false' }
    Conditions:
      ReadsServiceLogs: { Fn::Equals: [{ Ref: ReadAwsServiceLogs }, 'true'] }
      ReadsFindings: { Fn::Equals: [{ Ref: ReadSecurityFindings }, 'true'] }
      ReadsLogGroups: { Fn::Equals: [{ Ref: ReadTaggedLogGroups }, 'true'] }
      ManagesAlbLogs: { Fn::Equals: [{ Ref: EnableAlbAccessLogs }, 'true'] }
    Resources:
      ReaderPolicy:
        Type: AWS::IAM::ManagedPolicy
        Properties:
          ManagedPolicyName: VeraxControlReader
          PolicyDocument:
            Statement:
              - Sid: AutoInspecao
                Effect: Allow
                Action: [iam:GetRole, iam:SimulatePrincipalPolicy]
                Resource:
                  Fn::Sub: 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/verax/verax-control-reader'
              - Sid: PosturaEAtivos
                Effect: Allow
                Resource: '*'
                Action: [iam:ListUsers, ec2:DescribeInstances]
              - Sid: DescobrirFontes
                Effect: Allow
                Resource: '*'
                Action:
                  - inspector2:BatchGetAccountStatus
                  - logs:DescribeLogGroups
                  - logs:ListTagsForResource
                  - s3:GetBucketLocation
                  - wafv2:ListWebACLs
              - Fn::If:
                  - ReadsServiceLogs
                  - Sid: LerLogsDaAwsDestaConta
                    Effect: Allow
                    Action: s3:GetObject
                    Resource:
                      - Fn::Sub: 'arn:${AWS::Partition}:s3:::*/AWSLogs/${AWS::AccountId}/*'
                      - Fn::Sub: 'arn:${AWS::Partition}:s3:::*/AWSLogs/o-*/${AWS::AccountId}/*'
                  - { Ref: AWS::NoValue }
              - Fn::If:
                  - ReadsServiceLogs
                  - Sid: ListarLogsDaAwsDestaConta
                    Effect: Allow
                    Action: s3:ListBucket
                    Resource: { Fn::Sub: 'arn:${AWS::Partition}:s3:::*' }
                    Condition:
                      StringLike:
                        s3:prefix:
                          - Fn::Sub: 'AWSLogs/${AWS::AccountId}/*'
                          - Fn::Sub: 'AWSLogs/o-*/${AWS::AccountId}/*'
                  - { Ref: AWS::NoValue }
              - Fn::If:
                  - ReadsServiceLogs
                  - Sid: VerPrimeiroNivelDosBuckets
                    Effect: Allow
                    Action: s3:ListBucket
                    Resource: { Fn::Sub: 'arn:${AWS::Partition}:s3:::*' }
                    Condition: { StringEquals: { s3:delimiter: /, s3:prefix: ['', AWSLogs, AWSLogs/] } }
                  - { Ref: AWS::NoValue }
              - Fn::If:
                  - ReadsServiceLogs
                  - Sid: DecifrarLogsDaAwsSoPeloS3
                    Effect: Allow
                    Action: kms:Decrypt
                    Resource: '*'
                    Condition: { StringLike: { kms:ViaService: s3.*.amazonaws.com } }
                  - { Ref: AWS::NoValue }
              - Fn::If:
                  - ReadsFindings
                  - Sid: LerAchadosDeSeguranca
                    Effect: Allow
                    Resource: '*'
                    Action:
                      - access-analyzer:GetFinding
                      - access-analyzer:ListFindings
                      - guardduty:GetFindings
                      - guardduty:ListFindings
                      - inspector2:ListCoverage
                      - inspector2:ListFindings
                      - securityhub:GetEnabledStandards
                      - securityhub:GetFindings
                  - { Ref: AWS::NoValue }
              - Fn::If:
                  - ReadsLogGroups
                  - Sid: LerGruposDeLogEtiquetados
                    Effect: Allow
                    Action: [logs:DescribeLogStreams, logs:FilterLogEvents, logs:GetLogEvents]
                    Resource:
                      - Fn::Sub: 'arn:${AWS::Partition}:logs:*:${AWS::AccountId}:log-group:*'
                      - Fn::Sub: 'arn:${AWS::Partition}:logs:*:${AWS::AccountId}:log-group:*:*'
                    Condition: { StringEquals: { aws:ResourceTag/verax-control: leitura } }
                  - { Ref: AWS::NoValue }
              - Fn::If:
                  - HasLogBuckets
                  - Sid: LerObjetosDeLog
                    Effect: Allow
                    Action: s3:GetObject
                    Resource: { Ref: LogBucketArns }
                  - { Ref: AWS::NoValue }
              - Fn::If:
                  - DecryptsLogBuckets
                  - Sid: DecifrarSoPeloS3
                    Effect: Allow
                    Action: kms:Decrypt
                    Resource: { Ref: LogKmsKeyArns }
                    Condition: { StringLike: { kms:ViaService: s3.*.amazonaws.com } }
                  - { Ref: AWS::NoValue }
              - Fn::If:
                  - ManagesAlbLogs
                  - Sid: LigarLogDosAlb
                    Effect: Allow
                    Action: elasticloadbalancing:ModifyLoadBalancerAttributes
                    Resource:
                      Fn::Sub: 'arn:${AWS::Partition}:elasticloadbalancing:${AWS::Region}:${AWS::AccountId}:loadbalancer/app/*'
                  - { Ref: AWS::NoValue }
      GuardrailsPolicy:
        Type: AWS::IAM::ManagedPolicy
        Properties:
          ManagedPolicyName: VeraxControlGuardrails
          PolicyDocument:
            Statement:
              - Sid: SoDoNoDaVerax
                Effect: Deny
                Action: '*'
                Resource: '*'
                Condition:
                  NotIpAddress: { aws:SourceIp: { Fn::Split: [',', { Ref: NodeEgressIps }] } }
                  Bool: { aws:ViaAWSService: 'false' }
      ReaderRole:
        Type: AWS::IAM::Role
        Properties:
          RoleName: verax-control-reader
          Path: /verax/
          MaxSessionDuration: 3600
          PermissionsBoundary: { Ref: ReaderPolicy }
          ManagedPolicyArns: [{ Ref: ReaderPolicy }, { Ref: GuardrailsPolicy }]
          Tags:
            - { Key: 'verax-control:template', Value: '2' }
            - Key: 'verax-control:capabilities'
              Value:
                Fn::Join:
                  - ''
                  - - discovery
                    - Fn::If: [ReadsServiceLogs, ' service-logs', '']
                    - Fn::If: [ReadsFindings, ' findings', '']
                    - Fn::If: [ReadsLogGroups, ' log-groups', '']
            - Fn::If:
                - ManagesAlbLogs
                - Key: 'verax-control:alb-logs-bucket'
                  Value: { Fn::Sub: '${AWS::Region}/${AlbLogsBucket}' }
                - { Ref: AWS::NoValue }
          AssumeRolePolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: SoONoDaVerax
                Effect: Allow
                Principal: { Federated: accounts.google.com }
                Action: sts:AssumeRoleWithWebIdentity
                Condition:
                  StringEquals:
                    accounts.google.com:aud: { Ref: NodeServiceAccountId }
                    accounts.google.com:sub: { Ref: NodeServiceAccountId }
                    accounts.google.com:oaud: { Ref: Audience }
                  IpAddress:
                    aws:SourceIp: { Fn::Split: [',', { Ref: NodeEgressIps }] }
    Outputs:
      RoleArn: { Value: { Fn::GetAtt: ReaderRole.Arn } }
      LogsKeyArn: { Value: { Fn::GetAtt: [LogsKey, Arn] } }
  expectations:
    rules:
      sem_usuario_nem_chave: PASS
      nenhuma_saida_com_segredo: PASS
      papel_preso_ao_limite: PASS
      confianca_so_do_google: PASS
      confianca_amarrada_ao_no: PASS
      nega_fora_do_ip_do_no: PASS
      leitura_so_le: PASS
      conteudo_so_nos_recursos_informados: PASS
      autorizacoes_sao_interruptores: PASS
      objetos_so_em_awslogs_desta_conta: PASS
      listagem_so_das_pastas_desta_conta: PASS
      primeiro_nivel_so_com_o_separador: PASS
      decrypt_dos_logs_so_pelo_s3: PASS
      achados_so_com_leitura: PASS
      grupos_de_log_so_com_a_etiqueta: PASS
      etiquetas_do_papel: PASS
      escrita_do_alb_exata: PASS
      waf_e_guardduty_intocados: PASS

# --- Usuário, chave e segredo ---

- name: com um usuário, uma chave e o segredo numa saída (GetAtt em lista)
  input:
    Resources:
      Usuario: { Type: AWS::IAM::User, Properties: { UserName: verax-control-reader } }
      Chave: { Type: AWS::IAM::AccessKey, Properties: { UserName: { Ref: Usuario } } }
    Outputs:
      Saida: { Value: { Fn::GetAtt: [Chave, SecretAccessKey] } }
  expectations:
    rules:
      sem_usuario_nem_chave: FAIL
      nenhuma_saida_com_segredo: FAIL

- name: o segredo de uma chave numa saída, com o GetAtt na forma curta
  input:
    Outputs:
      Saida: { Value: { Fn::GetAtt: Chave.SecretAccessKey } }
  expectations:
    rules:
      nenhuma_saida_com_segredo: FAIL

- name: o segredo de uma chave numa saída, por Fn::Sub
  input:
    Outputs:
      Saida: { Value: { Fn::Sub: '${Chave.SecretAccessKey}' } }
  expectations:
    rules:
      nenhuma_saida_com_segredo: FAIL

- name: uma saída com nome de segredo
  input:
    Outputs:
      SessionToken: { Value: { Fn::GetAtt: [ReaderRole, Arn] } }
  expectations:
    rules:
      nenhuma_saida_com_segredo: FAIL

- name: um parâmetro secreto (NoEcho) devolvido numa saída
  input:
    Parameters:
      Senha: { Type: String, NoEcho: true }
    Outputs:
      Devolve: { Value: { Ref: Senha } }
  expectations:
    rules:
      nenhuma_saida_com_segredo: FAIL

- name: um grupo do IAM na pilha
  input:
    Resources:
      Grupo: { Type: AWS::IAM::Group, Properties: { GroupName: VeraxControlReaders } }
  expectations:
    rules:
      sem_usuario_nem_chave: FAIL

- name: a política de leitura pendurada num usuário que já existe
  input:
    Resources:
      ReaderPolicy:
        Type: AWS::IAM::ManagedPolicy
        Properties:
          { ManagedPolicyName: VeraxControlReader, Users: [admin], PolicyDocument: { Statement: [] } }
  expectations:
    rules:
      sem_usuario_nem_chave: FAIL

# --- O papel ---

- name: papel sem o limite de permissões
  input:
    Resources:
      ReaderRole:
        Type: AWS::IAM::Role
        Properties:
          RoleName: verax-control-reader
          Path: /verax/
          MaxSessionDuration: 3600
          ManagedPolicyArns: [{ Ref: ReaderPolicy }, { Ref: GuardrailsPolicy }]
  expectations:
    rules:
      papel_preso_ao_limite: FAIL

- name: papel com sessão de 12 horas
  input:
    Resources:
      ReaderRole:
        Type: AWS::IAM::Role
        Properties:
          RoleName: verax-control-reader
          Path: /verax/
          MaxSessionDuration: 43200
          PermissionsBoundary: { Ref: ReaderPolicy }
          ManagedPolicyArns: [{ Ref: ReaderPolicy }, { Ref: GuardrailsPolicy }]
  expectations:
    rules:
      papel_preso_ao_limite: FAIL

- name: papel com outro caminho (o ARN deixa de sair só do ID da conta)
  input:
    Resources:
      ReaderRole:
        Type: AWS::IAM::Role
        Properties:
          RoleName: verax-control-reader
          Path: /
          MaxSessionDuration: 3600
          PermissionsBoundary: { Ref: ReaderPolicy }
          ManagedPolicyArns: [{ Ref: ReaderPolicy }, { Ref: GuardrailsPolicy }]
  expectations:
    rules:
      papel_preso_ao_limite: FAIL

- name: papel com uma política em linha
  input:
    Resources:
      ReaderRole:
        Type: AWS::IAM::Role
        Properties:
          RoleName: verax-control-reader
          Path: /verax/
          MaxSessionDuration: 3600
          PermissionsBoundary: { Ref: ReaderPolicy }
          ManagedPolicyArns: [{ Ref: ReaderPolicy }, { Ref: GuardrailsPolicy }]
          Policies: [{ PolicyName: Extra, PolicyDocument: { Statement: [] } }]
  expectations:
    rules:
      papel_preso_ao_limite: FAIL

- name: papel com uma política gerenciada a mais
  input:
    Resources:
      ReaderRole:
        Type: AWS::IAM::Role
        Properties:
          RoleName: verax-control-reader
          Path: /verax/
          MaxSessionDuration: 3600
          PermissionsBoundary: { Ref: ReaderPolicy }
          ManagedPolicyArns:
            - { Ref: ReaderPolicy }
            - { Ref: GuardrailsPolicy }
            - arn:aws:iam::aws:policy/AdministratorAccess
  expectations:
    rules:
      papel_preso_ao_limite: FAIL

- name: papel sem a política de negação
  input:
    Resources:
      ReaderRole:
        Type: AWS::IAM::Role
        Properties:
          RoleName: verax-control-reader
          Path: /verax/
          MaxSessionDuration: 3600
          PermissionsBoundary: { Ref: ReaderPolicy }
          ManagedPolicyArns: [{ Ref: ReaderPolicy }]
  expectations:
    rules:
      papel_preso_ao_limite: FAIL

- name: a política de leitura anexada a outro papel
  input:
    Resources:
      ReaderRole:
        Type: AWS::IAM::Role
        Properties:
          RoleName: verax-control-reader
          Path: /verax/
          MaxSessionDuration: 3600
          PermissionsBoundary: { Ref: ReaderPolicy }
          ManagedPolicyArns: [{ Ref: ReaderPolicy }, { Ref: GuardrailsPolicy }]
      ReaderPolicy:
        Type: AWS::IAM::ManagedPolicy
        Properties:
          { ManagedPolicyName: VeraxControlReader, Roles: [OutroPapel], PolicyDocument: { Statement: [] } }
  expectations:
    rules:
      papel_preso_ao_limite: FAIL

# --- Quem entra no papel ---

- name: confiança sem o sub
  input:
    Resources:
      ReaderRole:
        Type: AWS::IAM::Role
        Properties:
          AssumeRolePolicyDocument:
            Statement:
              - Effect: Allow
                Principal: { Federated: accounts.google.com }
                Action: sts:AssumeRoleWithWebIdentity
                Condition:
                  StringEquals:
                    accounts.google.com:aud: { Ref: NodeServiceAccountId }
                    accounts.google.com:oaud: { Ref: Audience }
                  IpAddress: { aws:SourceIp: { Fn::Split: [',', { Ref: NodeEgressIps }] } }
  expectations:
    rules:
      confianca_so_do_google: PASS
      confianca_amarrada_ao_no: FAIL

- name: confiança sem o aud
  input:
    Resources:
      ReaderRole:
        Type: AWS::IAM::Role
        Properties:
          AssumeRolePolicyDocument:
            Statement:
              - Effect: Allow
                Principal: { Federated: accounts.google.com }
                Action: sts:AssumeRoleWithWebIdentity
                Condition:
                  StringEquals:
                    accounts.google.com:sub: { Ref: NodeServiceAccountId }
                    accounts.google.com:oaud: { Ref: Audience }
                  IpAddress: { aws:SourceIp: { Fn::Split: [',', { Ref: NodeEgressIps }] } }
  expectations:
    rules:
      confianca_amarrada_ao_no: FAIL

- name: confiança sem o oaud
  input:
    Resources:
      ReaderRole:
        Type: AWS::IAM::Role
        Properties:
          AssumeRolePolicyDocument:
            Statement:
              - Effect: Allow
                Principal: { Federated: accounts.google.com }
                Action: sts:AssumeRoleWithWebIdentity
                Condition:
                  StringEquals:
                    accounts.google.com:aud: { Ref: NodeServiceAccountId }
                    accounts.google.com:sub: { Ref: NodeServiceAccountId }
                  IpAddress: { aws:SourceIp: { Fn::Split: [',', { Ref: NodeEgressIps }] } }
  expectations:
    rules:
      confianca_amarrada_ao_no: FAIL

- name: confiança sem o IP do nó
  input:
    Resources:
      ReaderRole:
        Type: AWS::IAM::Role
        Properties:
          AssumeRolePolicyDocument:
            Statement:
              - Effect: Allow
                Principal: { Federated: accounts.google.com }
                Action: sts:AssumeRoleWithWebIdentity
                Condition:
                  StringEquals:
                    accounts.google.com:aud: { Ref: NodeServiceAccountId }
                    accounts.google.com:sub: { Ref: NodeServiceAccountId }
                    accounts.google.com:oaud: { Ref: Audience }
  expectations:
    rules:
      confianca_amarrada_ao_no: FAIL

- name: confiança sem condição nenhuma
  input:
    Resources:
      ReaderRole:
        Type: AWS::IAM::Role
        Properties:
          AssumeRolePolicyDocument:
            Statement:
              - Effect: Allow
                Principal: { Federated: accounts.google.com }
                Action: sts:AssumeRoleWithWebIdentity
  expectations:
    rules:
      confianca_so_do_google: PASS
      confianca_amarrada_ao_no: FAIL

- name: sub e aud com StringLike e curinga
  input:
    Resources:
      ReaderRole:
        Type: AWS::IAM::Role
        Properties:
          AssumeRolePolicyDocument:
            Statement:
              - Effect: Allow
                Principal: { Federated: accounts.google.com }
                Action: sts:AssumeRoleWithWebIdentity
                Condition:
                  StringLike:
                    accounts.google.com:aud: '*'
                    accounts.google.com:sub: '*'
                  StringEquals:
                    accounts.google.com:oaud: { Ref: Audience }
                  IpAddress: { aws:SourceIp: { Fn::Split: [',', { Ref: NodeEgressIps }] } }
  expectations:
    rules:
      confianca_amarrada_ao_no: FAIL

- name: sub com um curinga fixo no StringEquals
  input:
    Resources:
      ReaderRole:
        Type: AWS::IAM::Role
        Properties:
          AssumeRolePolicyDocument:
            Statement:
              - Effect: Allow
                Principal: { Federated: accounts.google.com }
                Action: sts:AssumeRoleWithWebIdentity
                Condition:
                  StringEquals:
                    accounts.google.com:aud: { Ref: NodeServiceAccountId }
                    accounts.google.com:sub: '*'
                    accounts.google.com:oaud: { Ref: Audience }
                  IpAddress: { aws:SourceIp: { Fn::Split: [',', { Ref: NodeEgressIps }] } }
  expectations:
    rules:
      confianca_amarrada_ao_no: FAIL

- name: o IP inteiro da internet no lugar do parâmetro
