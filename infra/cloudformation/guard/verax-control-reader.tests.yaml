                  IpAddress: { aws:SourceIp: ['0.0.0.0/0'] }
  expectations:
    rules:
      confianca_amarrada_ao_no: FAIL

- name: uma chave a mais no StringEquals (o e-mail, que a AWS manda não usar como identificador)
  input:
