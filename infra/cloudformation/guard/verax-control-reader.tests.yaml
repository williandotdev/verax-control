# Casos do `cfn-guard test` para as regras de verax-control-reader.guard: um modelo que passa e mutações por regra (um
# usuário, uma chave ou um segredo na pilha; cada condição da confiança tirada, afrouxada ou trocada; outro principal
# ou outra ação; o papel sem o limite ou com sessão, nome ou política a mais; sem o Deny de IP; GetObject em qualquer
# recurso) e as formas que uma regra frouxa deixaria passar (GetAtt em lista ou em texto, ação ou recurso em lista,
# curinga no StringLike ou no StringEquals, uma chave ou um operador a mais).
- name: modelo (o mínimo do template, como o cfn-guard o lê)
  input:
    Parameters:
      NodeServiceAccountId: { Type: String, AllowedPattern: '^[0-9]{21}$' }
      NodeEgressIps: { Type: String }
      Audience: { Type: String, Default: 'https://control.veraxsistemas.com.br/aws-reader' }
    Resources:
      ReaderPolicy:
        Type: AWS::IAM::ManagedPolicy
        Properties:
          ManagedPolicyName: VeraxControlReader
          PolicyDocument:
            Statement:
              - Fn::If:
                  - HasLogBuckets
                  - Sid: LerObjetosDeLog
                    Effect: Allow
                    Action: s3:GetObject
                    Resource: { Ref: LogBucketArns }
                  - { Ref: AWS::NoValue }
              - Fn::If:
                  - DecryptsLogBuckets
                  - Sid: DecifrarSoPeloS3
                    Effect: Allow
                    Action: kms:Decrypt
                    Resource: { Ref: LogKmsKeyArns }
                    Condition: { StringLike: { kms:ViaService: s3.*.amazonaws.com } }
                  - { Ref: AWS::NoValue }
              - Sid: AutoInspecao
                Effect: Allow
                Action: iam:SimulatePrincipalPolicy
                Resource:
                  Fn::Sub: 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/verax/verax-control-reader'
              - Sid: PosturaEAtivos
                Effect: Allow
                Resource: '*'
                Action: [iam:ListUsers, ec2:DescribeInstances]
      GuardrailsPolicy:
        Type: AWS::IAM::ManagedPolicy
        Properties:
          ManagedPolicyName: VeraxControlGuardrails
          PolicyDocument:
            Statement:
              - Sid: SoDoNoDaVerax
                Effect: Deny
                Action: '*'
                Resource: '*'
                Condition: { NotIpAddress: { aws:SourceIp: { Fn::Split: [',', { Ref: NodeEgressIps }] } } }
      ReaderRole:
        Type: AWS::IAM::Role
        Properties:
          RoleName: verax-control-reader
          Path: /verax/
          MaxSessionDuration: 3600
          PermissionsBoundary: { Ref: ReaderPolicy }
          ManagedPolicyArns: [{ Ref: ReaderPolicy }, { Ref: GuardrailsPolicy }]
          AssumeRolePolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: SoONoDaVerax
                Effect: Allow
                Principal: { Federated: accounts.google.com }
                Action: sts:AssumeRoleWithWebIdentity
                Condition:
                  StringEquals:
                    accounts.google.com:aud: { Ref: NodeServiceAccountId }
                    accounts.google.com:sub: { Ref: NodeServiceAccountId }
                    accounts.google.com:oaud: { Ref: Audience }
                  IpAddress:
                    aws:SourceIp: { Fn::Split: [',', { Ref: NodeEgressIps }] }
    Outputs:
      RoleArn: { Value: { Fn::GetAtt: ReaderRole.Arn } }
      LogsKeyArn: { Value: { Fn::GetAtt: [LogsKey, Arn] } }
  expectations:
    rules:
      sem_usuario_nem_chave: PASS
      nenhuma_saida_com_segredo: PASS
      papel_preso_ao_limite: PASS
      confianca_so_do_google: PASS
      confianca_amarrada_ao_no: PASS
      nega_fora_do_ip_do_no: PASS
      leitura_so_le: PASS
      conteudo_so_nos_recursos_informados: PASS
      waf_e_guardduty_intocados: PASS

# --- Usuário, chave e segredo ---

- name: com um usuário, uma chave e o segredo numa saída (GetAtt em lista)
  input:
    Resources:
      Usuario: { Type: AWS::IAM::User, Properties: { UserName: verax-control-reader } }
      Chave: { Type: AWS::IAM::AccessKey, Properties: { UserName: { Ref: Usuario } } }
    Outputs:
      Saida: { Value: { Fn::GetAtt: [Chave, SecretAccessKey] } }
  expectations:
    rules:
      sem_usuario_nem_chave: FAIL
      nenhuma_saida_com_segredo: FAIL

- name: o segredo de uma chave numa saída, com o GetAtt na forma curta
  input:
    Outputs:
      Saida: { Value: { Fn::GetAtt: Chave.SecretAccessKey } }
  expectations:
    rules:
      nenhuma_saida_com_segredo: FAIL

- name: o segredo de uma chave numa saída, por Fn::Sub
  input:
    Outputs:
      Saida: { Value: { Fn::Sub: '${Chave.SecretAccessKey}' } }
  expectations:
    rules:
      nenhuma_saida_com_segredo: FAIL

- name: uma saída com nome de segredo
  input:
    Outputs:
      SessionToken: { Value: { Fn::GetAtt: [ReaderRole, Arn] } }
  expectations:
    rules:
      nenhuma_saida_com_segredo: FAIL

- name: um parâmetro secreto (NoEcho) devolvido numa saída
  input:
    Parameters:
      Senha: { Type: String, NoEcho: true }
    Outputs:
      Devolve: { Value: { Ref: Senha } }
  expectations:
    rules:
      nenhuma_saida_com_segredo: FAIL

- name: um grupo do IAM na pilha
  input:
    Resources:
      Grupo: { Type: AWS::IAM::Group, Properties: { GroupName: VeraxControlReaders } }
  expectations:
    rules:
      sem_usuario_nem_chave: FAIL

- name: a política de leitura pendurada num usuário que já existe
  input:
    Resources:
      ReaderPolicy:
        Type: AWS::IAM::ManagedPolicy
        Properties:
          { ManagedPolicyName: VeraxControlReader, Users: [admin], PolicyDocument: { Statement: [] } }
  expectations:
    rules:
      sem_usuario_nem_chave: FAIL

# --- O papel ---

- name: papel sem o limite de permissões
