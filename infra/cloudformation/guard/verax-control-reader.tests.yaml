      ReaderRole:
        Type: AWS::IAM::Role
        Properties:
          AssumeRolePolicyDocument:
            Statement:
              - Effect: Allow
                Principal: { Federated: accounts.google.com }
                Action: [sts:AssumeRoleWithWebIdentity, sts:AssumeRole]
  expectations:
    rules:
      confianca_so_do_google: FAIL

