          ManagedPolicyArns:
            - { Ref: ReaderPolicy }
            - { Ref: GuardrailsPolicy }
            - arn:aws:iam::aws:policy/AdministratorAccess
  expectations:
    rules:
      papel_preso_ao_limite: FAIL

- name: papel sem a política de negação
  input:
    Resources:
      ReaderRole:
        Type: AWS::IAM::Role
        Properties:
          RoleName: verax-control-reader
          Path: /verax/
          MaxSessionDuration: 3600
          PermissionsBoundary: { Ref: ReaderPolicy }
          ManagedPolicyArns: [{ Ref: ReaderPolicy }]
  expectations:
    rules:
      papel_preso_ao_limite: FAIL

- name: a política de leitura anexada a outro papel
  input:
    Resources:
      ReaderRole:
        Type: AWS::IAM::Role
        Properties:
          RoleName: verax-control-reader
          Path: /verax/
          MaxSessionDuration: 3600
          PermissionsBoundary: { Ref: ReaderPolicy }
          ManagedPolicyArns: [{ Ref: ReaderPolicy }, { Ref: GuardrailsPolicy }]
      ReaderPolicy:
        Type: AWS::IAM::ManagedPolicy
        Properties:
          { ManagedPolicyName: VeraxControlReader, Roles: [OutroPapel], PolicyDocument: { Statement: [] } }
  expectations:
    rules:
      papel_preso_ao_limite: FAIL

# --- Quem entra no papel ---

- name: confiança sem o sub
  input:
    Resources:
      ReaderRole:
        Type: AWS::IAM::Role
        Properties:
          AssumeRolePolicyDocument:
            Statement:
              - Effect: Allow
                Principal: { Federated: accounts.google.com }
                Action: sts:AssumeRoleWithWebIdentity
                Condition:
                  StringEquals:
                    accounts.google.com:aud: { Ref: NodeServiceAccountId }
                    accounts.google.com:oaud: { Ref: Audience }
                  IpAddress: { aws:SourceIp: { Fn::Split: [',', { Ref: NodeEgressIps }] } }
  expectations:
    rules:
      confianca_so_do_google: PASS
      confianca_amarrada_ao_no: FAIL

- name: confiança sem o aud
