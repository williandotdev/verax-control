      confianca_amarrada_ao_no: FAIL

# --- Negação de fora do IP do nó ---

- name: sem o Deny de fora do IP do nó
  input:
    Resources:
      GuardrailsPolicy:
        Type: AWS::IAM::ManagedPolicy
        Properties:
          ManagedPolicyName: VeraxControlGuardrails
          PolicyDocument:
            Statement:
              - { Sid: NuncaAlterarLogs, Effect: Deny, Action: ['s3:Delete*'], Resource: '*' }
  expectations:
    rules:
      nega_fora_do_ip_do_no: FAIL

- name: Deny de IP com um IP fixo no lugar do parâmetro
  input:
    Resources:
      GuardrailsPolicy:
        Type: AWS::IAM::ManagedPolicy
        Properties:
          ManagedPolicyName: VeraxControlGuardrails
          PolicyDocument:
            Statement:
              - Sid: SoDoNoDaVerax
                Effect: Deny
                Action: '*'
                Resource: '*'
                Condition: { NotIpAddress: { aws:SourceIp: ['0.0.0.0/0'] } }
  expectations:
    rules:
      nega_fora_do_ip_do_no: FAIL

- name: Deny de IP com um segundo operador (só valeria numa região)
  input:
    Resources:
      GuardrailsPolicy:
        Type: AWS::IAM::ManagedPolicy
        Properties:
          ManagedPolicyName: VeraxControlGuardrails
          PolicyDocument:
            Statement:
              - Sid: SoDoNoDaVerax
                Effect: Deny
                Action: '*'
                Resource: '*'
                Condition:
                  NotIpAddress: { aws:SourceIp: { Fn::Split: [',', { Ref: NodeEgressIps }] } }
                  StringEquals: { aws:RequestedRegion: us-east-1 }
  expectations:
    rules:
      nega_fora_do_ip_do_no: FAIL

- name: Deny de IP com outra chave ao lado do aws:SourceIp
  input:
    Resources:
      GuardrailsPolicy:
        Type: AWS::IAM::ManagedPolicy
        Properties:
          ManagedPolicyName: VeraxControlGuardrails
          PolicyDocument:
            Statement:
              - Sid: SoDoNoDaVerax
                Effect: Deny
                Action: '*'
                Resource: '*'
                Condition:
                  NotIpAddress:
                    aws:SourceIp: { Fn::Split: [',', { Ref: NodeEgressIps }] }
                    aws:VpcSourceIp: 10.0.0.0/8
  expectations:
    rules:
      nega_fora_do_ip_do_no: FAIL

- name: Deny de IP com NotResource (parte dos recursos fica de fora)
  input:
    Resources:
      GuardrailsPolicy:
        Type: AWS::IAM::ManagedPolicy
        Properties:
          ManagedPolicyName: VeraxControlGuardrails
          PolicyDocument:
            Statement:
              - Sid: SoDoNoDaVerax
                Effect: Deny
                Action: '*'
                Resource: '*'
                NotResource: 'arn:aws:s3:::*'
                Condition: { NotIpAddress: { aws:SourceIp: { Fn::Split: [',', { Ref: NodeEgressIps }] } } }
  expectations:
    rules:
      nega_fora_do_ip_do_no: FAIL

# --- Leitura ---

- name: GetObject em qualquer recurso
  input:
    Resources:
      ReaderPolicy:
        Type: AWS::IAM::ManagedPolicy
        Properties:
          ManagedPolicyName: VeraxControlReader
          PolicyDocument:
            Statement:
              - Fn::If:
                  - HasLogBuckets
                  - { Sid: LerObjetosDeLog, Effect: Allow, Action: s3:GetObject, Resource: '*' }
                  - { Ref: AWS::NoValue }
  expectations:
    rules:
      leitura_so_le: PASS
      conteudo_so_nos_recursos_informados: FAIL

- name: GetObject em todos os buckets por curinga
  input:
    Resources:
      ReaderPolicy:
        Type: AWS::IAM::ManagedPolicy
        Properties:
          ManagedPolicyName: VeraxControlReader
          PolicyDocument:
            Statement:
              - Fn::If:
                  - HasLogBuckets
                  - Sid: LerObjetosDeLog
                    Effect: Allow
                    Action: s3:GetObject
                    Resource: 'arn:aws:s3:::*/*'
                  - { Ref: AWS::NoValue }
  expectations:
    rules:
      conteudo_so_nos_recursos_informados: FAIL

- name: GetObject em todos os buckets por curinga, com o recurso numa lista
  input:
    Resources:
      ReaderPolicy:
        Type: AWS::IAM::ManagedPolicy
        Properties:
          ManagedPolicyName: VeraxControlReader
          PolicyDocument:
            Statement:
              - Fn::If:
                  - HasLogBuckets
                  - Sid: LerObjetosDeLog
                    Effect: Allow
                    Action: s3:GetObject
                    Resource: [{ Fn::Sub: 'arn:${AWS::Partition}:s3:::um-bucket/*' }, 'arn:aws:s3:::*/*']
                  - { Ref: AWS::NoValue }
  expectations:
    rules:
      conteudo_so_nos_recursos_informados: FAIL

- name: GetObject em qualquer recurso, com a ação numa lista
  input:
    Resources:
      ReaderPolicy:
        Type: AWS::IAM::ManagedPolicy
        Properties:
          ManagedPolicyName: VeraxControlReader
          PolicyDocument:
            Statement:
              - Fn::If:
                  - HasLogBuckets
                  - Sid: LerObjetosDeLog
                    Effect: Allow
                    Action: [s3:GetObject, s3:GetBucketLocation]
                    Resource: '*'
                  - { Ref: AWS::NoValue }
  expectations:
    rules:
      leitura_so_le: PASS
      conteudo_so_nos_recursos_informados: FAIL

- name: Decrypt em qualquer chave da conta
  input:
    Resources:
      ReaderPolicy:
        Type: AWS::IAM::ManagedPolicy
        Properties:
          ManagedPolicyName: VeraxControlReader
          PolicyDocument:
            Statement:
              - Fn::If:
                  - DecryptsLogBuckets
