          AssumeRolePolicyDocument:
            Statement:
              - Effect: Allow
                Principal: { Federated: accounts.google.com }
                Action: sts:AssumeRoleWithWebIdentity
              - Effect: Allow
                Principal: { AWS: 'arn:aws:iam::222222222222:root' }
