          ManagedPolicyArns: [{ Ref: ReaderPolicy }, { Ref: GuardrailsPolicy }]
          Policies: [{ PolicyName: Extra, PolicyDocument: { Statement: [] } }]
  expectations:
    rules:
      papel_preso_ao_limite: FAIL

- name: papel com uma política gerenciada a mais
  input:
    Resources:
      ReaderRole:
        Type: AWS::IAM::Role
        Properties:
          RoleName: verax-control-reader
          Path: /verax/
          MaxSessionDuration: 3600
