      ReaderRole:
        Type: AWS::IAM::Role
        Properties:
          RoleName: verax-control-reader
          Path: /verax/
          MaxSessionDuration: 3600
          ManagedPolicyArns: [{ Ref: ReaderPolicy }, { Ref: GuardrailsPolicy }]
  expectations:
    rules:
      papel_preso_ao_limite: FAIL

- name: papel com sessão de 12 horas
  input:
    Resources:
      ReaderRole:
        Type: AWS::IAM::Role
        Properties:
          RoleName: verax-control-reader
          Path: /verax/
          MaxSessionDuration: 43200
          PermissionsBoundary: { Ref: ReaderPolicy }
          ManagedPolicyArns: [{ Ref: ReaderPolicy }, { Ref: GuardrailsPolicy }]
  expectations:
    rules:
      papel_preso_ao_limite: FAIL

- name: papel com outro caminho (o ARN deixa de sair só do ID da conta)
  input:
    Resources:
      ReaderRole:
        Type: AWS::IAM::Role
        Properties:
          RoleName: verax-control-reader
          Path: /
          MaxSessionDuration: 3600
          PermissionsBoundary: { Ref: ReaderPolicy }
          ManagedPolicyArns: [{ Ref: ReaderPolicy }, { Ref: GuardrailsPolicy }]
  expectations:
    rules:
      papel_preso_ao_limite: FAIL

- name: papel com uma política em linha
  input:
    Resources:
      ReaderRole:
        Type: AWS::IAM::Role
        Properties:
          RoleName: verax-control-reader
          Path: /verax/
          MaxSessionDuration: 3600
