name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

# Permissão mínima por padrão; cada job pede só o que precisa.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: 'true'
  # Sem telemetria nem checagem de atualização do CLI do Prisma.
  CHECKPOINT_DISABLE: '1'

jobs:
  lint:
    name: Lint, formatação e tipos
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck

  test:
    name: Testes
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
        env:
          POSTGRES_USER: verax
          # Banco efêmero, existe só durante o job e só na rede do runner. Não é um segredo.
          POSTGRES_PASSWORD: ci-ephemeral-db
          POSTGRES_DB: verax_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U verax -d verax_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://verax:ci-ephemeral-db@localhost:5432/verax_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  e2e:
    name: Testes de navegador
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
        env:
          POSTGRES_USER: verax
          # Banco efêmero, existe só durante o job e só na rede do runner. Não é um segredo.
          POSTGRES_PASSWORD: ci-ephemeral-db
          POSTGRES_DB: verax_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U verax -d verax_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://verax:ci-ephemeral-db@localhost:5432/verax_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Instalar o Chromium do Playwright
        run: pnpm --filter @verax/web exec playwright install --with-deps chromium
      # Catálogo e estrutura (servidor de desenvolvimento e modo mock), com axe.
      - run: pnpm --filter @verax/web test:e2e
      # Painel compilado, com a CSP de produção, contra a API real e o PostgreSQL de teste.
      - run: pnpm --filter @verax/web test:e2e:fullstack
      - name: Guardar relatórios e traces em caso de falha
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-relatorios
          path: |
            apps/web/playwright-report
            apps/web/playwright-report-fullstack
            apps/web/test-results
          retention-days: 7
