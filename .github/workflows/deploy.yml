name: Deploy

# Publica a aplicação (T8.5): staging automático e produção com aprovação manual no environment do GitHub.
# Desligado até a conta AWS existir: só roda com a variável de repositório AWS_DEPLOY_ENABLED=true.
#
# Sem chave fixa: cada environment assume, por OIDC, o papel de deploy do ambiente (variável AWS_DEPLOY_ROLE_ARN do
# environment, saída deploy_role_arn do Terraform). Esse papel só publica versões; infraestrutura é Terraform.
# Antes de publicar, os mesmos gates dos PRs rodam de novo (CI, Segurança e IaC).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  TRIVY_VERSION: 0.76.1
  TRIVY_SHA256: c7cbe3137fb8a48a17574bede3dd6beb16742d1e9772929940fc90082c39d9c0
  SYFT_VERSION: 1.55.0
  SYFT_SHA256: bb65249542db5fedeeb4d3f9b018b75e7264dbfbbb10486f044581a92f90490d

jobs:
  enabled:
    name: Deploy ligado?
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          ENABLED: ${{ vars.AWS_DEPLOY_ENABLED }}
        run: |
          if [[ $ENABLED == true ]]; then echo "run=true"; else echo "run=false"; fi >> "$GITHUB_OUTPUT"

  ci:
    needs: enabled
    if: needs.enabled.outputs.run == 'true'
    uses: ./.github/workflows/ci.yml

  security:
    needs: enabled
    if: needs.enabled.outputs.run == 'true'
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read
      security-events: write

  iac:
    needs: enabled
    if: needs.enabled.outputs.run == 'true'
    uses: ./.github/workflows/iac.yml

  build:
    name: Imagens (build, Trivy e SBOM)
    needs: [ci, security, iac]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        run: |
          docker build -f apps/api/Dockerfile -t verax-api:release .
          docker build -f apps/api/Dockerfile --target migrate -t verax-api-migrate:release .
      - name: Instalar trivy e syft (checksum fixado)
        run: |
          curl -fsSLo trivy.tar.gz "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  trivy.tar.gz" | sha256sum --check --strict
          tar -xzf trivy.tar.gz trivy && rm trivy.tar.gz
          curl -fsSLo syft.tar.gz "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/syft_${SYFT_VERSION}_linux_amd64.tar.gz"
          echo "${SYFT_SHA256}  syft.tar.gz" | sha256sum --check --strict
          tar -xzf syft.tar.gz syft && rm syft.tar.gz
      - name: Trivy (vulnerabilidade alta com correção bloqueia)
        run: |
          for image in verax-api:release verax-api-migrate:release; do
            ./trivy image --scanners vuln,secret --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --no-progress "$image"
          done
      - name: SBOM (SPDX)
        run: |
          mkdir -p sbom
          ./syft scan docker:verax-api:release -o "spdx-json=sbom/verax-api.spdx.json"
          ./syft scan docker:verax-api-migrate:release -o "spdx-json=sbom/verax-api-migrate.spdx.json"
      - name: Empacotar imagens
        run: docker save verax-api:release verax-api-migrate:release | gzip > images.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: imagens
          path: images.tar.gz
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom/
          retention-days: 90

  staging:
    name: Staging (publicação, attestation e ZAP)
    needs: build
    uses: ./.github/workflows/release.yml
    with:
      environment: staging
      zap: true
    permissions:
      contents: read
      id-token: write
      attestations: write

  production:
    name: Produção (aprovação manual)
    needs: staging
    uses: ./.github/workflows/release.yml
    with:
      environment: production
      zap: false
    permissions:
      contents: read
      id-token: write
      attestations: write
