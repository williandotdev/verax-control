name: Publicação num ambiente

# Chamado só pelo deploy.yml (T8.5), uma vez por ambiente. O environment do GitHub guarda o papel OIDC do ambiente
# (AWS_DEPLOY_ROLE_ARN) e, em produção, exige aprovação manual antes deste job começar.

on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      zap:
        type: boolean
        required: true

permissions:
  contents: read

jobs:
  release:
    name: Publicar em ${{ inputs.environment }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: imagens
      - name: Carregar imagens
        run: gunzip -c images.tar.gz | docker load
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: verax-deploy-${{ inputs.environment }}
          aws-region: sa-east-1
      - name: Build do painel com a API deste ambiente
        env:
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          api_domain=$(aws ssm get-parameter --name "/verax-control/verax-control-${ENVIRONMENT}/release/config" \
            --query Parameter.Value --output text | jq -er .api_domain)
          pnpm install --frozen-lockfile
          VITE_API_URL="https://${api_domain}" pnpm --filter @verax/web build
      - name: Publicar
        id: release
        env:
          ENVIRONMENT: ${{ inputs.environment }}
        run: bash scripts/release.sh "$ENVIRONMENT"
      - name: Attestation de origem (API)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.release.outputs.api_repository }}
          subject-digest: ${{ steps.release.outputs.api_digest }}
      - name: Attestation de origem (migrations)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.release.outputs.migrate_repository }}
          subject-digest: ${{ steps.release.outputs.migrate_digest }}
      - name: OWASP ZAP no ambiente publicado (risco alto reprova)
        if: inputs.zap
        env:
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          config=$(aws ssm get-parameter --name "/verax-control/verax-control-${ENVIRONMENT}/release/config" \
            --query Parameter.Value --output text)
          mkdir -p zap
          ZAP_REPORT_DIR="$PWD/zap" bash scripts/zap-baseline.sh "https://$(jq -er .panel_domain <<<"$config")"
          ZAP_REPORT_DIR="$PWD/zap-api" bash scripts/zap-baseline.sh "https://$(jq -er .api_domain <<<"$config")/health"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: inputs.zap && always()
        with:
          name: zap-${{ inputs.environment }}
          path: |
            zap/
            zap-api/
          retention-days: 30
