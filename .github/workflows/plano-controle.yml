name: Plano de controle

# Publica a imagem do plano de controle no Artifact Registry e implanta os dois serviços do Cloud Run (cp-public e
# cp-worker: a mesma imagem, com ROLE diferente) no projeto da Verax. A revisão nova sobe sem tráfego, com a sonda
# de partida em /health, e só recebe o tráfego depois de responder.
#
# Login na GCP sem chave (Workload Identity Federation): só jobs deste repositório no environment `control-plane`,
# que só aceita a `main` (molde do painel.yml). Projeto, região, registro e contas de serviço vêm das variáveis do
# environment, nunca do código. Sem elas, nada roda: o workflow é seguro de existir antes de o environment ser
# criado (docs/STATUS.md, CP-01, lista o que o responsável configura).

on:
  push:
    branches: [main]
    paths:
      - 'apps/control-plane/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.base.json'
      - '.github/workflows/plano-controle.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plano-controle
  cancel-in-progress: false

env:
  PUBLIC_SERVICE: cp-public
  WORKER_SERVICE: cp-worker
  # Etiqueta da revisão candidata (sem tráfego) até o /health responder.
  CANDIDATE_TAG: candidato

jobs:
  publicar:
    name: Publicar a imagem e implantar (Cloud Run)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: control-plane
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      # As variáveis do environment só existem dentro do job: a checagem fica num passo. Falta alguma, nada roda.
      - name: Conferir a configuração
        id: config
        env:
          CP_IMAGES_REPOSITORY: ${{ vars.CP_IMAGES_REPOSITORY }}
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
          GCP_CP_DEPLOY_SA: ${{ vars.GCP_CP_DEPLOY_SA }}
          CP_PUBLIC_SA: ${{ vars.CP_PUBLIC_SA }}
          CP_WORKER_SA: ${{ vars.CP_WORKER_SA }}
        run: |
          ready=true
          for name in CP_IMAGES_REPOSITORY GCP_PROJECT_ID GCP_REGION GCP_WIF_PROVIDER GCP_CP_DEPLOY_SA CP_PUBLIC_SA CP_WORKER_SA; do
            if [ -z "${!name}" ]; then
              echo "::notice::$name não configurada no environment control-plane; nada a implantar."
              ready=false
            fi
          done
          echo "ready=$ready" >> "$GITHUB_OUTPUT"
      - if: steps.config.outputs.ready == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Credenciais em arquivo para o gcloud do runner (CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE) e token de acesso
      # para o docker login no registro.
      - name: Login na GCP (sem chave)
        if: steps.config.outputs.ready == 'true'
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_CP_DEPLOY_SA }}
          token_format: access_token
          access_token_lifetime: 1800s
      - name: Build e publicação da imagem
        if: steps.config.outputs.ready == 'true'
        id: build
        env:
          REPOSITORY: ${{ vars.CP_IMAGES_REPOSITORY }}
          GOOGLE_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          set -euo pipefail
          registry=${REPOSITORY%%/*}
          docker login -u oauth2accesstoken --password-stdin "https://$registry" <<<"$GOOGLE_ACCESS_TOKEN"
          image="$REPOSITORY/control-plane:$GITHUB_SHA"
          docker build -f apps/control-plane/Dockerfile \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            -t "$image" .
          docker push --quiet "$image"
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$image" | cut -d@ -f2)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          docker logout "https://$registry" >/dev/null
      - name: Atestação de origem
        if: steps.config.outputs.ready == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ vars.CP_IMAGES_REPOSITORY }}/control-plane
          subject-digest: ${{ steps.build.outputs.digest }}
      # A revisão nova nasce sem tráfego e etiquetada; o gcloud só termina quando a sonda de partida (/health) passa.
      # Nada do que já está configurado no serviço (variáveis, segredos, IAM) é tocado: só a imagem e o papel.
      - name: Implantar sem tráfego (cp-public e cp-worker)
        if: steps.config.outputs.ready == 'true'
        env:
          PROJECT: ${{ vars.GCP_PROJECT_ID }}
          REGION: ${{ vars.GCP_REGION }}
          REPOSITORY: ${{ vars.CP_IMAGES_REPOSITORY }}
          DIGEST: ${{ steps.build.outputs.digest }}
          PUBLIC_SA: ${{ vars.CP_PUBLIC_SA }}
          WORKER_SA: ${{ vars.CP_WORKER_SA }}
        run: |
          set -euo pipefail
          image="$REPOSITORY/control-plane@$DIGEST"
          deploy() { # <serviço> <papel> <conta de serviço> <máximo de instâncias> <timeout da requisição>
            gcloud run deploy "$1" --project "$PROJECT" --region "$REGION" --image "$image" \
              --service-account "$3" --no-traffic --tag "$CANDIDATE_TAG" \
              --update-env-vars "ROLE=$2,NODE_ENV=production,TRUST_PROXY_HOPS=1" \
              --cpu 1 --memory 512Mi --min-instances 0 --max-instances "$4" --timeout "$5" \
              --startup-probe "httpGet.path=/health,httpGet.port=8080,periodSeconds=5,failureThreshold=12,timeoutSeconds=3" \
              --labels "commit=$GITHUB_SHA" --quiet
          }
          # cp-public atrás do Hosting (rewrite de 60 s); cp-worker atende tasks e o Scheduler (até 15 min).
          deploy "$PUBLIC_SERVICE" public "$PUBLIC_SA" 2 60
          deploy "$WORKER_SERVICE" worker "$WORKER_SA" 1 900
      - name: Conferir o /health da revisão candidata
        if: steps.config.outputs.ready == 'true'
        env:
          PROJECT: ${{ vars.GCP_PROJECT_ID }}
          REGION: ${{ vars.GCP_REGION }}
        run: |
          set -euo pipefail
          describe() { gcloud run services describe "$1" --project "$PROJECT" --region "$REGION" --format json; }
          # cp-public aceita invocação anônima (exigência do rewrite do Hosting): o endereço etiquetado responde direto.
          url=$(describe "$PUBLIC_SERVICE" | jq -er --arg tag "$CANDIDATE_TAG" '.status.traffic[] | select(.tag == $tag) | .url')
          curl -fsS --retry 5 --retry-all-errors "$url/health" | grep -q '"status":"ok"'
          echo "$PUBLIC_SERVICE: /health respondeu na revisão candidata"
          # cp-worker é só IAM: a prova é a condição Ready da revisão, que depende da sonda de partida em /health.
          for service in "$WORKER_SERVICE" "$PUBLIC_SERVICE"; do
            revision=$(describe "$service" | jq -er --arg tag "$CANDIDATE_TAG" '.status.traffic[] | select(.tag == $tag) | .revisionName')
            gcloud run revisions describe "$revision" --project "$PROJECT" --region "$REGION" --format json |
              jq -e '.status.conditions[] | select(.type == "Ready") | .status == "True"' >/dev/null
            echo "$service: revisão $revision pronta"
          done
      - name: Promover a revisão nova
        if: steps.config.outputs.ready == 'true'
        env:
          PROJECT: ${{ vars.GCP_PROJECT_ID }}
          REGION: ${{ vars.GCP_REGION }}
        run: |
          set -euo pipefail
          for service in "$PUBLIC_SERVICE" "$WORKER_SERVICE"; do
            gcloud run services update-traffic "$service" --project "$PROJECT" --region "$REGION" --to-latest --quiet
            echo "$service: tráfego na revisão nova"
          done
      - name: Resumo
        if: steps.config.outputs.ready == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "### Plano de controle implantado (versão \`$GITHUB_SHA\`)"
            echo "- Imagem: \`$DIGEST\`"
            echo "- Serviços: \`$PUBLIC_SERVICE\` e \`$WORKER_SERVICE\`, promovidos depois do /health"
          } >> "$GITHUB_STEP_SUMMARY"
