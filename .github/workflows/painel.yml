name: Painel

# Publica a demonstração comercial do painel (dados fictícios simulados no navegador, sem API) no Firebase Hosting do
# projeto da Verax na GCP, a cada merge na `main` que mexa no painel. Os sites de produção (o SOC da própria Verax e
# cada cliente) não passam mais por aqui desde a atualização da frota (decisão de 16/11/2026): o painel de cada destino
# anda junto com o nó dele, publicado pelo plano de controle a partir do bundle da versão (docs/runbooks/painel.md e
# docs/ARQUITETURA.md, "Atualização da frota"). O site e o domínio da demonstração são públicos (não há cliente neles):
# ficam aqui, e não num secret. Login na GCP sem chave (Workload Identity Federation): só jobs deste repositório no
# environment `painel`, que só aceita a `main`.

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'packages/shared/**'
      - 'pnpm-lock.yaml'
      - 'scripts/firebase-hosting-deploy.mjs'
      - 'scripts/scan-bundle.mjs'
      - '.github/workflows/painel.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: painel
  cancel-in-progress: false

env:
  DEMO_SITE: verax-control-demo
  DEMO_DOMAIN: control.veraxsistemas.com.br

jobs:
  publicar:
    name: Publicar a demonstração (Firebase Hosting)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: painel
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Login na GCP (sem chave)
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
          token_format: access_token
          access_token_lifetime: 900s
      - name: Publicar a demonstração
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          set -euo pipefail
          # A "API" é simulada no navegador, na própria origem do site.
          VITE_API_URL="https://${DEMO_DOMAIN}" pnpm --filter @verax/web build:demo
          node scripts/firebase-hosting-deploy.mjs "$DEMO_SITE" apps/web/dist apps/web/dist-hosting.json
          # Conferência no endereço padrão do Firebase (o domínio próprio pode ainda não estar no DNS).
          base="https://${DEMO_SITE}.web.app"
          headers=$(curl -fsSI --retry 5 --retry-all-errors "${base}/")
          grep -qi '^content-security-policy:' <<<"$headers"
          grep -qi '^strict-transport-security:' <<<"$headers"
          # index.html sempre revalidado; arquivos com hash em /assets com cache longo.
          grep -qi '^cache-control: no-cache' <<<"$headers"
          asset=$(curl -fsS "${base}/" | grep -o '/assets/[A-Za-z0-9._-]*\.js' | head -1)
          curl -fsSI "${base}${asset}" | grep -qi '^cache-control:.*immutable'
          echo "${DEMO_SITE}: publicado e com os cabeçalhos de segurança"
