# Atualizações automáticas semanais. Atualizações de SEGURANÇA ignoram o cooldown e chegam assim que publicadas.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/Sao_Paulo
    # Espera 7 dias antes de propor versão nova de rotina (defesa contra pacote sequestrado).
    # Precisa ser maior que o minimumReleaseAge do pnpm (24h), senão o install do PR falha.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    versioning-strategy: increase
    ignore:
      # Os tipos do Node acompanham a major do runtime (Node 24, ver .nvmrc). A troca de major é feita junto
      # com a do runtime, não sozinha.
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
      production-dependencies:
        dependency-type: production
        update-types: [minor, patch]
    commit-message:
      prefix: deps

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/Sao_Paulo
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: ci

  - package-ecosystem: docker-compose
    directories:
      - /
      - /infra/wazuh
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/Sao_Paulo
    cooldown:
      default-days: 7
    commit-message:
      prefix: deps

  # Providers de cada raiz do Terraform (AWS e GCP). O PR atualiza o .terraform.lock.hcl; o iac.yml valida.
  - package-ecosystem: terraform
    directories:
      - /infra/terraform/bootstrap
      - /infra/terraform/envs/staging
      - /infra/terraform/envs/production
      - /infra/gcp/envs/verax
      - /infra/gcp/envs/homolog-sp
      - /infra/gcp/envs/control-plane
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/Sao_Paulo
    cooldown:
      default-days: 7
    groups:
      terraform-providers:
        patterns: ['*']
    commit-message:
      prefix: deps

  # cfn-lint do CI. O arquivo tem o hash de cada pacote; o Dependabot atualiza versão e hashes juntos.
  - package-ecosystem: pip
    directory: /infra/cloudformation
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/Sao_Paulo
    cooldown:
      default-days: 7
    groups:
      cfn-lint:
        patterns: ['*']
    commit-message:
      prefix: deps

  # Imagens base fixadas por digest: API (apps/api/Dockerfile) e Prowler agendado (infra/prowler/Dockerfile).
  - package-ecosystem: docker
    directories:
      - /apps/api
      - /infra/prowler
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/Sao_Paulo
    cooldown:
      default-days: 7
    commit-message:
      prefix: deps
