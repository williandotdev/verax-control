# Atualizações automáticas semanais. Atualizações de SEGURANÇA ignoram o cooldown e chegam assim que publicadas.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/Sao_Paulo
    # Espera 7 dias antes de propor versão nova de rotina (defesa contra pacote sequestrado).
    # Precisa ser maior que o minimumReleaseAge do pnpm (24h), senão o install do PR falha.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    versioning-strategy: increase
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
      production-dependencies:
        dependency-type: production
        update-types: [minor, patch]
    commit-message:
      prefix: deps

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/Sao_Paulo
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: ci

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/Sao_Paulo
    cooldown:
      default-days: 7
    commit-message:
      prefix: deps
