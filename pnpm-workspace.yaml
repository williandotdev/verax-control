packages:
  - apps/*
  - packages/*

# Endurecimento da cadeia de suprimentos (supply chain).
# Quarentena de 24h: versões recém-publicadas não são instaladas, defesa contra pacotes sequestrados.
# O Semgrep recomenda 7 dias; 24h foi a decisão aprovada para equilibrar segurança e versões recentes
# (docs/STATUS.md, desvios). Mudar para 10080 é uma linha.
minimumReleaseAge: 1440 # nosemgrep: package_managers.pnpm.pnpm-missing-minimum-release-age.pnpm-minimum-release-age
# Falha se a prova de origem (provenance) de um pacote piorar em relação a versões anteriores.
trustPolicy: no-downgrade
# A checagem de confiança vale para versões publicadas nos últimos 30 dias, janela em que pacotes
# sequestrados costumam ser detectados. Releases antigos de manutenção (ex.: semver@6.3.1, backport de
# correção publicado depois das 7.x com provenance) geram falso positivo e já passaram por escrutínio.
trustPolicyIgnoreAfter: 43200
# Exceções por versão exata, aprovadas pelo responsável e com causa verificada (docs/STATUS.md, desvios).
# Remover assim que o pacote voltar a ser publicado com provenance.
trustPolicyExclude:
  # Desde prisma/orm#30035 (ago/2026) o CLI `prisma` é publicado com o token do prismabot, sem OIDC; os
  # pacotes @prisma/* da mesma release mantêm provenance. Issue aberta: prisma/orm#30850.
  - prisma@7.10.1
# Subdependências só podem vir do registry (sem git ou tarball remoto).
blockExoticSubdeps: true
# Scripts de instalação só rodam para pacotes listados em allowBuilds com true.
strictDepBuilds: true
allowBuilds:
  # O Schema Engine (migrations) é baixado pelo próprio CLI na primeira execução, com checksum conferido.
  '@prisma/engines': false
  # Telemetria de instalação trazida pelo swagger-ui-dist; nada a ganhar em rodar.
  '@scarf/scarf': false
  # O binário nativo do SWC já vem pelas optionalDependencies; o postinstall é só um fallback.
  '@swc/core': false
  # Os hooks do git são instalados pelo script "prepare" do projeto, não pelo postinstall do pacote.
  lefthook: false
  # O preinstall só confere a versão do Node, o que o engineStrict já faz.
  prisma: false
saveExact: true
engineStrict: true

# Correções de segurança em dependências transitivas (remover quando os pacotes pais atualizarem).
overrides:
  # GHSA-g3hv-75wg-m249 (DoS em globparts). Entra via ESLint, typescript-eslint e Nest CLI.
  'minimatch@<11.0.1': 11.0.1
